    /* Modern mobile facelift — same structure, warmer Alcron palette */
    :root{
      --bg:#07070a;
      --panel:#121217;
      --panel2:#1c1b21;
      --line:rgba(255,244,232,.115);
      --text:#fbf3e8;
      --muted:rgba(251,243,232,.62);
      --accent:#7d3d2d;
      --accentHi:#a45b47;
      --accentSoft:rgba(125,61,45,.22);
      --goldSoft:rgba(213,159,101,.12);
      --shadow:0 18px 58px rgba(0,0,0,.48);
      --radius:24px;
    }
    body{
      background:
        radial-gradient(circle at 18% -8%, rgba(164,91,71,.28), transparent 32%),
        radial-gradient(circle at 92% 8%, rgba(213,159,101,.10), transparent 34%),
        linear-gradient(180deg,#111014 0%,#09090c 46%,#07070a 100%);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    .wrap{padding:18px 13px 116px;}
    header{display:none}
    h1{
      font-size:29px;
      letter-spacing:-.065em;
      font-weight:950;
      color:#fff7ee;
      text-shadow:0 12px 32px rgba(0,0,0,.45);
    }
    .tabs{
      margin:13px 0 10px;
      padding:4px;
      gap:4px;
      border-radius:20px;
      border:1px solid rgba(255,244,232,.10);
      background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 14px 36px rgba(0,0,0,.22);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }
    .tab{
      padding:9px 3px;
      border-radius:16px;
      font-size:10.5px;
      letter-spacing:-.01em;
      transition:transform .16s ease, background .16s ease, color .16s ease;
    }
    .tab:active{transform:scale(.98)}
    .tab.active{
      background:linear-gradient(180deg,var(--accentHi),var(--accent));
      color:#fff8f2;
      box-shadow:0 10px 26px rgba(125,61,45,.34), inset 0 1px 0 rgba(255,255,255,.16);
    }
    .search{
      padding:7px 0 13px;
      background:linear-gradient(180deg,rgba(7,7,10,.98),rgba(7,7,10,.76) 70%,transparent);
    }
    .search input{
      min-height:54px;
      border:0!important;
      outline:none!important;
      background:linear-gradient(180deg,rgba(255,255,255,.095),rgba(255,255,255,.055));
      border-radius:22px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 10px 30px rgba(0,0,0,.20)!important;
    }
    .search input:focus{
      background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.075));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 12px 34px rgba(0,0,0,.28)!important;
    }
    .searchIcon{opacity:.72;color:#ffe5d7;}
    .cards{gap:11px;}
    .cocktail,.steak-card,.panel{
      border-color:rgba(255,244,232,.105);
      background:linear-gradient(180deg,rgba(31,30,36,.94),rgba(17,17,22,.96));
      box-shadow:0 18px 48px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.055);
    }
    .cocktail{
      position:relative;
      overflow:hidden;
      padding:14px 14px 13px;
      background:
        linear-gradient(145deg,rgba(125,61,45,.16),transparent 36%),
        linear-gradient(180deg,rgba(27,27,33,.98),rgba(12,12,16,.98));
    }
    .cocktail::before{
      content:"";
      position:absolute;
      left:0;right:0;top:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(255,221,198,.32),transparent);
      pointer-events:none;
    }
    .cocktail h2{font-size:21px;font-weight:950;color:#fff8ef;}
    .tag{
      border:1px solid rgba(255,255,255,.13);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    }
    .tag.Sweet{background:linear-gradient(180deg,rgba(189,124,73,.30),rgba(189,124,73,.16));color:#ffe5c8;}
    .tag.Sour{background:linear-gradient(180deg,rgba(132,148,86,.30),rgba(132,148,86,.14));color:#eff6ce;}
    .tag.Bitter{background:linear-gradient(180deg,rgba(125,61,45,.36),rgba(125,61,45,.18));color:#ffd9c9;}
    .tag.Boozy{background:linear-gradient(180deg,rgba(115,101,91,.34),rgba(115,101,91,.17));color:#f5e8dc;}
    .tag.Fizzy{background:linear-gradient(180deg,rgba(82,134,126,.34),rgba(82,134,126,.16));color:#d9fff5;}
    .tag.Light{background:linear-gradient(180deg,rgba(194,163,107,.30),rgba(194,163,107,.14));color:#fff0ca;}
    .tag.Savory{background:linear-gradient(180deg,rgba(124,96,73,.32),rgba(124,96,73,.15));color:#f2dfce;}
    .story{font-size:12.5px;color:rgba(251,243,232,.61);line-height:1.34;margin-bottom:10px;}
    .ingrid{margin-top:6px;margin-bottom:10px;}
    .ingrow{padding:7.5px 0;border-bottom-color:rgba(255,255,255,.065);}
    .iname{font-size:14px;color:#fff5eb;}
    .iamt{font-size:14px;color:#ffd6c3;}
    .meta{
      margin-top:11px;
      border-color:rgba(164,91,71,.26);
      background:linear-gradient(180deg,rgba(125,61,45,.13),rgba(255,255,255,.025));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.045);
    }
    .metaRow{background:rgba(255,255,255,.035);}
    .metaLabel{color:#ffcdb8;font-weight:850;}
    .metaValue{color:rgba(251,243,232,.84);}
    .panel{overflow:hidden;}
    .money-row{padding:13px 14px;}
    input[type="number"]{
      border-color:rgba(255,244,232,.10);
      background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.052));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.055);
    }
    input[type="number"]:focus{
      border-color:rgba(164,91,71,.58);
      box-shadow:0 0 0 4px rgba(125,61,45,.18), inset 0 1px 0 rgba(255,255,255,.08);
    }
    .rate{
      background:linear-gradient(180deg,var(--accentHi),var(--accent));
      box-shadow:0 10px 24px rgba(125,61,45,.25), inset 0 1px 0 rgba(255,255,255,.14);
    }
    .inputBox{
      background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.045));
      border-color:rgba(255,244,232,.10);
    }
    .priceLine{
      background:linear-gradient(180deg,rgba(125,61,45,.24),rgba(125,61,45,.14));
      border:1px solid rgba(164,91,71,.18);
    }
    .bottom{
      background:linear-gradient(180deg,transparent,rgba(7,7,10,.72) 18%,rgba(7,7,10,.97));
    }
    .cash-total{
      border-color:rgba(164,91,71,.45);
      background:linear-gradient(180deg,rgba(29,28,34,.92),rgba(15,15,19,.92));
      box-shadow:0 -16px 44px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.06);
    }
    .clear{
      background:linear-gradient(180deg,var(--accentHi),var(--accent));
      box-shadow:0 -2px 0 rgba(255,255,255,.08) inset, 0 12px 28px rgba(125,61,45,.27);
    }
    .clear:active{transform:scale(.985)}

  

    /* Final: glass style search field, no black border */
    .search{
      padding:7px 0 13px;
      background:linear-gradient(180deg,rgba(34,35,41,.94),rgba(34,35,41,.62) 68%,transparent)!important;
      backdrop-filter:blur(18px)!important;
      -webkit-backdrop-filter:blur(18px)!important;
    }
    .searchBox{
      position:relative;
      border-radius:22px;
      background:rgba(255,255,255,.075);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 12px 28px rgba(0,0,0,.16);
      backdrop-filter:blur(20px) saturate(145%);
      -webkit-backdrop-filter:blur(20px) saturate(145%);
    }
    .searchBox::before{
      content:'';
      position:absolute;
      inset:0;
      border-radius:22px;
      pointer-events:none;
      background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.035));
      border:1px solid rgba(255,255,255,.13);
    }
    .search input{
      position:relative;
      z-index:1;
      width:100%;
      border:0!important;
      outline:none!important;
      -webkit-appearance:none;
      appearance:none;
      border-radius:22px!important;
      min-height:54px;
      padding:0 16px 0 45px;
      background:transparent!important;
      color:var(--text);
      box-shadow:none!important;
    }
    .search input:focus{
      border:0!important;
      outline:none!important;
      background:transparent!important;
      box-shadow:none!important;
    }
    .searchBox:focus-within{
      background:rgba(255,255,255,.105);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.20), 0 14px 34px rgba(0,0,0,.20), 0 0 0 3px rgba(125,61,45,.14);
    }
    .searchIcon{
      z-index:2;
      color:rgba(255,232,220,.80)!important;
      opacity:.82!important;
    }

  

    /* Final mobile tweak: darker classics top + larger tabs */
    body{
      background:
        radial-gradient(circle at 20% -10%, rgba(64,65,72,.42), transparent 32%),
        linear-gradient(180deg,#1c1d22 0%,#17181c 42%,#121316 100%) !important;
    }
    .search{
      background:linear-gradient(180deg,rgba(13,14,17,.995),rgba(18,19,23,.86) 68%,transparent) !important;
    }
    .tabs{
      margin:14px 0 12px !important;
      padding:5px !important;
      gap:6px !important;
      border-radius:22px !important;
    }
    .tab{
      min-height:48px !important;
      padding:13px 5px !important;
      border-radius:17px !important;
      font-size:12px !important;
      line-height:1.08 !important;
      letter-spacing:-.02em !important;
    }
    @media (max-width:380px){
      .tab{font-size:11.2px !important;min-height:46px !important;padding:12px 3px !important;}
    }


    /* Search field refinement: soft glass + fade, no black frame */
    .searchBox{
      overflow:hidden;
      background:
        linear-gradient(90deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.075) 45%,rgba(255,255,255,.035) 100%) !important;
      border:0 !important;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.18),
        inset 0 -1px 0 rgba(255,255,255,.035),
        0 14px 34px rgba(0,0,0,.16) !important;
    }
    .searchBox::before{
      border:0 !important;
      background:
        linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.025) 56%,rgba(125,61,45,.08)) !important;
    }
    .searchBox::after{
      content:'';
      position:absolute;
      inset:0;
      pointer-events:none;
      border-radius:22px;
      background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.10) 48%,transparent 100%);
      opacity:.24;
      mix-blend-mode:screen;
    }
    .search input{
      font-size:16px !important;
      font-weight:780 !important;
      letter-spacing:-.015em;
      caret-color:#ffd8c8;
    }
    .search input::placeholder{
      color:rgba(246,241,232,.43);
      font-size:13px;
      font-weight:750;
      letter-spacing:.01em;
    }
    .searchBox:focus-within{
      background:
        linear-gradient(90deg,rgba(255,255,255,.155) 0%,rgba(255,255,255,.092) 48%,rgba(125,61,45,.08) 100%) !important;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        0 16px 38px rgba(0,0,0,.18),
        0 0 0 3px rgba(125,61,45,.11) !important;
    }

  
    /* Final search field adjustment */
    .searchBox{
      position:relative;
      border-radius:22px;
      background:linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.055));
      box-shadow:0 18px 42px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.14);
    }
    .searchBox::before{
      content:"";
      position:absolute;
      inset:-1px;
      border-radius:23px;
      pointer-events:none;
      background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.035));
      opacity:.75;
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;
      mask-composite:exclude;
      padding:1px;
    }
    .search input{
      border:0!important;
      outline:none!important;
      background:transparent!important;
      box-shadow:none!important;
    }
    .search input::placeholder{
      color:rgba(246,241,232,.48);
      font-size:13px;
      font-weight:750;
      letter-spacing:.01em;
    }
    .searchBox:focus-within{
      box-shadow:0 20px 48px rgba(0,0,0,.25),0 0 0 4px rgba(125,61,45,.13),inset 0 1px 0 rgba(255,255,255,.18);
    }

    /* Classic cocktails background: darkest at top, softer grey towards the bottom */
    body.classics-mode{
      background:
        radial-gradient(circle at 22% -12%, rgba(63,64,72,.26), transparent 34%),
        linear-gradient(180deg,#0b0c10 0%,#111217 34%,#17181d 68%,#1d1e23 100%) !important;
    }
    body.classics-mode .search{
      background:linear-gradient(180deg,rgba(11,12,16,.995),rgba(13,14,18,.86) 68%,transparent) !important;
    }

  

/* Signature section + two-row main navigation */
.tabs{
  grid-template-columns:1fr 1fr !important;
  gap:6px !important;
}
.tab{
  min-height:48px !important;
}
.signature-card{
  position:relative;
  overflow:hidden;
  padding:14px;
  border:1px solid rgba(255,244,232,.105);
  border-radius:var(--radius);
  background:linear-gradient(180deg,rgba(31,30,36,.94),rgba(17,17,22,.96));
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.055);
}
.signature-card::before{
  content:"";
  position:absolute;
  left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,221,198,.30),transparent);
  pointer-events:none;
}
.signatureTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:9px}
.cocktailTitleBlock{min-width:0;flex:1}
.signatureTitleBlock{min-width:0;flex:1}
.cocktail h2{overflow-wrap:anywhere}
.signatureTop h2{margin:0;font-size:21px;line-height:1.05;letter-spacing:-.05em;color:#fff8ef;font-weight:950;overflow-wrap:anywhere}
.signatureAllergens{margin-top:2px;color:rgba(246,241,232,.34);font-size:7.8px;font-weight:560;letter-spacing:.025em;line-height:1.15;overflow-wrap:anywhere}

    const recipes = [{"name":"Amaretto Sour","allergens":"3, 8","story":"The Amaretto Sour became widely known in the 1970s, when amaretto liqueurs were heavily promoted in the United States. Its exact origin is not clearly documented, and many early versions were simple mixes of amaretto and sour mix. Modern bartending versions improved the drink with fresh lemon and a tighter sweet-sour balance. The result is a soft, almond-led sour that works as a dessert-style classic without becoming heavy.","ingredients":[{"name":"AMARETTO DISARONNO","amount":"40 ml"},{"name":"LEMON JUICE","amount":"20 ml"},{"name":"SIMPLE SYRUP","amount":"5 ml"},{"name":"EGG WHITE","amount":"20 ml"}],"method":"Shake / Double Strain","glass":"Savage Pony / no ice","garnish":"3 Dots Angostura bitters","category":"Sour","sales":72},{"name":"Aviation","allergens":"N/A","story":"The Aviation was first published in Hugo R. Ensslin's Recipes for Mixed Drinks in 1916. Ensslin was head bartender at the Hotel Wallick in New York, and his recipe used gin, maraschino, lemon and crème de violette. Later versions, including The Savoy Cocktail Book, often omitted the violet liqueur, which changed both the colour and aroma of the drink. Its revival followed the renewed availability of crème de violette in modern cocktail bars.","ingredients":[{"name":"HOUSE GIN","amount":"40 ml"},{"name":"LIME JUICE","amount":"15 ml"},{"name":"VIOLET LIQUEUR","amount":"15 ml"},{"name":"LUXARDO MARASCHINO","amount":"10 ml"}],"method":"Shake / Double Strain","glass":"Nick & Nora / no ice","garnish":"Maraschino Cherry","category":"Sour","sales":5},{"name":"Americano","allergens":"12","story":"The Americano evolved from the Milano-Torino, a simple combination of Campari from Milan and sweet vermouth from Turin. Soda water was added to make the drink lighter and more refreshing. The name is commonly linked to American visitors in Italy who favoured the longer, sparkling serve. It remains an important bridge between the aperitivo tradition and the later Negroni.","ingredients":[{"name":"CAMPARI","amount":"30 ml"},{"name":"PUNT E MES","amount":"30 ml"},{"name":"SODA WATER","amount":"Top"}],"method":"Build / Top with Soda Water","glass":"Nude Highball / ice chunk","garnish":"Orange Wedge","category":"Fizzy","sales":7},{"name":"Aperol Spritz","allergens":"12","story":"The Spritz tradition began in northern Italy when wine was lightened with a splash of water or soda. Aperol was launched in Padua in 1919 and became one of the most recognisable bitter aperitifs used in the serve. The modern Aperol Spritz combines Aperol, Prosecco and soda in a low-alcohol aperitivo format. Its popularity grew because it is bright, bitter-sweet, easy to drink and strongly connected with Italian aperitivo culture.","ingredients":[{"name":"APEROL","amount":"40 ml"},{"name":"PROSECCO","amount":"90 ml"},{"name":"SODA WATER","amount":"30 ml"}],"method":"Build","glass":"Rona Wine / ice chunk","garnish":"Orange Slice","category":"Fizzy","sales":138},{"name":"Brandy Alexander","allergens":"7","story":"The Brandy Alexander developed from the earlier Alexander family of cream cocktails. By the early twentieth century, the brandy version had become the best-known expression of the style. It combines spirit, cacao and cream in a rich dessert format, usually finished with nutmeg. Its pop-culture reputation was reinforced in the 1970s when John Lennon famously compared the drink to a milkshake during his so-called lost weekend.","ingredients":[{"name":"MARTEL VS","amount":"30 ml"},{"name":"CRÈME DE CACAO","amount":"30 ml"},{"name":"HEAVY CREAM","amount":"30 ml"}],"method":"Shake / Double Strain","glass":"Nick & Nora / no ice","garnish":"Grated Nutmeg","category":"Sweet","sales":0},{"name":"Angel Face","allergens":"N/A","story":"The Angel Face is best known from Harry Craddock's The Savoy Cocktail Book, published in 1930. It belongs to the compact, spirit-forward drinks of the Prohibition and interwar period. The equal-parts structure of gin, apricot brandy and apple brandy makes it deceptively simple but powerful. The exact creator is not clearly documented, so it is safest to present it as a Savoy-era classic rather than a drink with a confirmed author.","ingredients":[{"name":"HOUSE GIN","amount":"30 ml"},{"name":"APRICOT BRANDY","amount":"30 ml"},{"name":"CALVADOS","amount":"30 ml"}],"method":"Shake / Double Strain","glass":"Nick & Nora / no ice","garnish":"Not specified","category":"Boozy","sales":0},{"name":"Boulevardier","allergens":"12","story":"The Boulevardier was published by Harry MacElhone in Barflies and Cocktails in 1927. It is closely associated with Erskine Gwynne, an American expatriate in Paris who edited a magazine called The Boulevardier. Structurally, it is a whiskey-based cousin of the Negroni, replacing gin with bourbon or rye. Its history makes it a useful example of how American whiskey culture and European aperitivo drinking met in 1920s Paris.","ingredients":[{"name":"HOUSE BOURBON","amount":"30 ml"},{"name":"CAMPARI","amount":"30 ml"},{"name":"CARPANO ANTICA FORMULA","amount":"30 ml"}],"method":"Stir","glass":"Nude Water / ice sphere","garnish":"Orange Coin","category":"Bitter","sales":0},{"name":"Between the Sheets","allergens":"N/A","story":"Between the Sheets is usually placed in the Sidecar family of brandy, orange liqueur and citrus drinks. Many sources attribute it to Harry MacElhone of Harry's New York Bar in Paris, but other claims link it to the Berkeley Hotel in London. The exact origin is disputed, so it should be introduced with caution rather than as a single confirmed invention story. Its combination of rum and cognac gives the drink a drier, more spirituous profile than many sour-style classics.","ingredients":[{"name":"HAVANA 3YO","amount":"30 ml"},{"name":"FERRAND 10 GENERATIONS","amount":"30 ml"},{"name":"LEMON JUICE","amount":"30 ml"},{"name":"COINTREAU","amount":"30 ml"},{"name":"SIMPLE SYRUP","amount":"10 ml"}],"method":"Shake / Double Strain","glass":"Nick & Nora / no ice","garnish":"Orange Coin","category":"Sour","sales":0},{"name":"Barracuda","allergens":"12","story":"The Barracuda is a sparkling tropical cocktail made with rum, Galliano, pineapple, lime and Prosecco or sparkling wine. It is recognised by the International Bartenders Association, but its exact creator and first place of service are not clearly documented in major historical sources. The drink reflects a late twentieth-century style that combines tiki-adjacent fruit flavours with a sparkling finish. It is best presented as a modern classic with a tropical profile rather than an old pre-Prohibition drink.","ingredients":[{"name":"HAVANA 7YO","amount":"45 ml"},{"name":"GALLIANO","amount":"15 ml"},{"name":"PINEAPPLE JUICE","amount":"60 ml"},{"name":"LIME JUICE","amount":"10 ml"},{"name":"PROSECCO","amount":"Top"}],"method":"Shake / Double Strain","glass":"Nude Highball / Ice","garnish":"Dry Pineapple / Mint Sprig","category":"Sweet","sales":0},{"name":"Bohemian Summer Edition","allergens":"9","story":"The exact origin of this drink is not clearly documented in widely cited cocktail sources. It reads as a house-style summer cocktail built around Becherovka, citrus, pineapple and elderflower. Becherovka brings a Czech herbal identity, while pineapple and lemon move the drink into a bright sour style. For guests, it can be explained as a modern Czech-accented summer sour rather than a historically established classic.","ingredients":[{"name":"BECHEROVKA","amount":"40 ml"},{"name":"ELDERFLOWER","amount":"15 ml"},{"name":"SIMPLE SYRUP","amount":"10 ml"},{"name":"PINEAPPLE JUICE","amount":"40 ml"},{"name":"LEMON JUICE","amount":"20 ml"},{"name":"CELERY BITTERS","amount":"3 dash"}],"method":"Shake / Double Strain","glass":"Nude Highball / ice chunk","garnish":"Mint Sprig","category":"Sweet","sales":0},{"name":"Blood and Sand","allergens":"12","story":"The Blood and Sand is named after the 1922 Rudolph Valentino film about bullfighting. It appears in The Savoy Cocktail Book in 1930 and is one of the few classic Scotch cocktails built as a shaken drink. The colour connection comes from cherry liqueur and orange juice, which echo the film's dramatic imagery. Its equal-parts structure makes it unusual, balancing whisky, sweet vermouth, cherry and orange in a soft but recognisable classic.","ingredients":[{"name":"CHIVAS REGAL 12YO","amount":"25 ml"},{"name":"DOLIN RED","amount":"25 ml"},{"name":"CHERRY HEERING","amount":"25 ml"},{"name":"ORANGE JUICE","amount":"25 ml"}],"method":"Shake / Double Strain","glass":"Nick & Nora / no ice","garnish":"Not specified","category":"Sweet","sales":0},{"name":"Bloody Mary","allergens":"4, 6","story":"The Bloody Mary has several competing origin stories. One of the most cited credits Fernand Petiot at the New York Bar in Paris during the early 1920s. Petiot later worked in New York, where the drink evolved into the more seasoned tomato-vodka cocktail recognised today. Because the history is disputed, it is best described as a Paris-born or Paris-influenced drink that became a full savoury classic in the United States.","ingredients":[{"name":"HOUSE VODKA","amount":"45 ml"},{"name":"TOMATO JUICE","amount":"90 ml"},{"name":"LEMON JUICE","amount":"10 ml"},{"name":"WORCESTERSHIRE SAUCE","amount":"2 dash"},{"name":"TABASCO","amount":"2 dash"},{"name":"CELERY BITTERS","amount":"2 dash"},{"name":"PEPPER/CELERY SALT","amount":"Pinch"}],"method":"Roll","glass":"Nude Highball / ice chunk","garnish":"Skewer Cucumber Wheel","category":"Savory","sales":46},{"name":"Bramble","allergens":"N/A","story":"The Bramble was created by Dick Bradsell in London in the mid-1980s. Bradsell served it at Fred's Club in Soho and drew inspiration from memories of blackberry picking on the Isle of Wight. The drink updated the gin sour by adding crème de mûre over crushed ice. It became one of the clearest examples of the British cocktail revival of the late twentieth century.","ingredients":[{"name":"HOUSE GIN","amount":"40 ml"},{"name":"LEMON JUICE","amount":"25 ml"},{"name":"SIMPLE SYRUP","amount":"10 ml"},{"name":"CRÈME DE MURE / CASSIS - FLOAT","amount":"15 ml"}],"method":"Shake","glass":"Nude Lowball / Crushed Ice","garnish":"Lemon Zest","category":"Sour","sales":1},{"name":"Basil Smash","allergens":"N/A","story":"The Basil Smash was created in 2008 by Jörg Meyer at Le Lion in Hamburg. It was originally known as the Gin Basil Smash and was inspired by the fresh-herb approach of modern craft bars. The recipe is essentially a gin sour shaken hard with fresh basil. Its rapid international success shows how a simple modern drink can become a contemporary classic when the concept is clear and easy to reproduce.","ingredients":[{"name":"HOUSE GIN","amount":"40 ml"},{"name":"LEMON JUICE","amount":"20 ml"},{"name":"SIMPLE SYRUP","amount":"20 ml"},{"name":"BASIL LEAVES","amount":"5 ml"}],"method":"Shake / Double Strain","glass":"Nude Water / ice chunk","garnish":"Basil Leaves","category":"Sour","sales":0},{"name":"Bee's Knees","allergens":"N/A","story":"The Bee's Knees is usually associated with the Prohibition era. Its exact creator is not firmly documented, although the drink appears in early twentieth-century cocktail writing. Honey and lemon helped make gin more approachable at a time when spirit quality could vary widely. Today it is valued less as a cover for rough alcohol and more as a clean, elegant gin sour with a soft honey texture.","ingredients":[{"name":"HOUSE GIN","amount":"50 ml"},{"name":"HONEY WATER","amount":"10 ml"},{"name":"LEMON JUICE","amount":"20 ml"}],"method":"Build","glass":"Nick & Nora / Shake","garnish":"Lime Wedge","category":"Sour","sales":1},{"name":"Black Russian","allergens":"N/A","story":"The Black Russian was created in 1949 by Gustave Tops at the Hotel Metropole in Brussels. It was reportedly made for Perle Mesta, the American ambassador to Luxembourg. The drink combines vodka and coffee liqueur in a simple, dark after-dinner style. Its name reflects both the colour of the drink and the vodka base, rather than a Russian place of origin.","ingredients":[{"name":"HOUSE VODKA","amount":"50 ml"},{"name":"KAHLUA","amount":"30 ml"}],"method":"Build in glass","glass":"Nude Lowball / ice block","garnish":"Not specified","category":"Sweet","sales":2},{"name":"Brandy Crusta","allergens":"N/A","story":"The Brandy Crusta dates to the 1850s and is widely credited to Joseph Santini in New Orleans. It is one of the important ancestors of the Sidecar and other citrus-brandy cocktails. The sugared rim and long citrus peel made it visually distinctive at a time when cocktail presentation was becoming more refined. Its structure of brandy, citrus, sweetener, bitters and liqueur makes it a key nineteenth-century cocktail reference.","ingredients":[{"name":"ARARAT 10Y","amount":"50 ml"},{"name":"LUXARDO MARASCHINO","amount":"10 ml"},{"name":"COINTREAU","amount":"1 BSP"},{"name":"SIMPLE SYRUP","amount":"1 BSP"},{"name":"LEMON JUICE","amount":"15 ml"},{"name":"ANGOSTURA BITTERS","amount":"2 dash"}],"method":"Stir","glass":"Savage Pony / no ice","garnish":"Sugar Rim / Orange Twist","category":"Sour","sales":0},{"name":"Bentley Cocktail","allergens":"12","story":"The Bentley Cocktail is an early twentieth-century aperitif-style drink built around Calvados and Dubonnet. It appears in classic cocktail literature, but its exact creator is not clearly documented. The drink reflects the period's interest in wine-based aperitifs and fruit brandies served in simple stirred formats. It is best explained as a light, elegant Calvados classic rather than a drink with a firm origin story.","ingredients":[{"name":"CALVADOS","amount":"30 ml"},{"name":"DUBONNET","amount":"60 ml"},{"name":"ORANGE BITTERS","amount":"2 dash"}],"method":"Stir","glass":"Savage Pony / no ice","garnish":"Orange Coin","category":"Light","sales":0},{"name":"Caipirinha","allergens":"N/A","story":"The Caipirinha is Brazil's national cocktail and is built around cachaça, lime and sugar. Its exact origin is debated, with stories connecting it to rural São Paulo and to home remedies made with lime and sugar. The name is linked to the Portuguese word caipira, referring to someone from the countryside. Today the drink is the clearest international expression of cachaça and Brazilian lime-sugar balance.","ingredients":[{"name":"CACHACA","amount":"40 ml"},{"name":"DARK SUGAR","amount":"3 BSP"},{"name":"HALF A LIME IN PIECES","amount":"3 ml"},{"name":"CACHACA TOP-UP","amount":"10 ml"}],"method":"Build / Muddle","glass":"Nude Lowball / Crushed Ice","garnish":"Lime Peel Zest / Straw","category":"Sour","sales":18},{"name":"Clover Club","allergens":"3","story":"The Clover Club is named after a Philadelphia gentlemen's club that met at the Bellevue-Stratford Hotel. The club was active around the late nineteenth and early twentieth centuries. The cocktail became known as a refined gin sour with raspberry and egg white, suited to the elegant hotel-bar culture of the period. Its revival in modern bars helped restore a classic that had fallen out of favour during much of the twentieth century.","ingredients":[{"name":"HOUSE GIN","amount":"40 ml"},{"name":"SIMPLE SYRUP","amount":"15 ml"},{"name":"LEMON JUICE","amount":"15 ml"},{"name":"RASPBERRY PURÉE","amount":"5 ml"},{"name":"EGG WHITE","amount":"20 ml"}],"method":"Shake / Double Strain","glass":"Nude Coupetini / no ice","garnish":"Not specified","category":"Sweet","sales":3},{"name":"Corpse Reviver No. 2","allergens":"12","story":"Corpse Revivers were originally a family of morning-after pick-me-up drinks. The best-known No. 2 version was published in Harry Craddock's The Savoy Cocktail Book in 1930. The original called for Kina Lillet, which is no longer produced in the same form, so modern versions use Lillet Blanc or similar substitutes. Its equal-parts structure and absinthe accent make it one of the most elegant sour-style classics from the Savoy era.","ingredients":[{"name":"HOUSE GIN","amount":"20 ml"},{"name":"LEMON JUICE","amount":"20 ml"},{"name":"LILLET BLANC","amount":"20 ml"},{"name":"COINTREAU","amount":"20 ml"},{"name":"DASH OF ABSINTHE","amount":"2 dash"}],"method":"Shake / Double Strain","glass":"Nick & Nora / no ice","garnish":"Lemon Twist","category":"Sour","sales":0},{"name":"Cosmopolitan","allergens":"N/A","story":"The modern Cosmopolitan is widely associated with Toby Cecchini at The Odeon in New York in the late 1980s. His version used citrus vodka, Cointreau, fresh lime and cranberry juice. Earlier cranberry-and-vodka drinks existed, so the exact genealogy is broader than a single invention story. The drink became a cultural icon in the 1990s through New York bar culture and later television exposure.","ingredients":[{"name":"ABSOLUT CITRON","amount":"40 ml"},{"name":"COINTREAU","amount":"20 ml"},{"name":"LIME JUICE","amount":"20 ml"},{"name":"CRANBERRY JUICE","amount":"20 ml"}],"method":"Shake / Double Strain","glass":"Nude Coupetini / no ice","garnish":"Orange Coin","category":"Sour","sales":73},{"name":"Casino","allergens":"N/A","story":"The Casino is an early twentieth-century gin cocktail linked to the same family as the Aviation. It appears in classic recipe books including Hugo Ensslin's 1916 Recipes for Mixed Drinks and later Savoy-era sources. The combination of gin, maraschino, citrus and orange bitters gives it a dry, aromatic profile. Its exact first creator is not clearly documented, so it is best presented as a printed early-modern classic.","ingredients":[{"name":"OLD TOM GIN","amount":"40 ml"},{"name":"LUXARDO MARASCHINO","amount":"10 ml"},{"name":"LEMON JUICE","amount":"10 ml"},{"name":"ORANGE BITTERS","amount":"2 dash"}],"method":"Shake / Double Strain","glass":"Nude Lowball / ice block","garnish":"Lemon Peel / Cherry","category":"Boozy","sales":0},{"name":"Champagne Cocktail","allergens":"12","story":"The Champagne Cocktail is one of the oldest documented sparkling cocktails. A version appears in Jerry Thomas's nineteenth-century bartending guides, built around sugar, bitters and sparkling wine. Later versions added a small measure of brandy or liqueur for depth. Its history is less about one named creator and more about the long tradition of dressing Champagne for celebration service.","ingredients":[{"name":"HENNESSY VS","amount":"40 ml"},{"name":"ANGOSTURA BITTERS","amount":"2 dash"},{"name":"GRAND MARNIER","amount":"1 BSP"},{"name":"SUGAR CUBE","amount":"1 ml"},{"name":"HOUSE CHAMPAGNE TOP-UP","amount":""}],"method":"Build in glass","glass":"Champagne Zafferano","garnish":"Lemon Peel","category":"Sweet","sales":0},{"name":"Cuba Libre","allergens":"N/A","story":"The Cuba Libre is generally linked to Cuba around the turn of the twentieth century. Its name means Free Cuba and reflects the period after the Spanish-American War. The drink became possible in its familiar form when Coca-Cola and Cuban rum met in the same market. Lime is important because it separates the drink from a simple rum and cola and gives it a sharper Cuban identity.","ingredients":[{"name":"HOUSE WHITE RUM","amount":"40 ml"},{"name":"LIME JUICE","amount":"10 ml"},{"name":"COCA COLA","amount":"Top"}],"method":"Build in glass","glass":"Nude Highball / Chunk Ice","garnish":"Lime Wedge","category":"Fizzy","sales":46},{"name":"Daiquiri","allergens":"N/A","story":"The Daiquiri is most often credited to Jennings Cox, an American engineer working near Daiquirí in Cuba around the end of the nineteenth century. The basic structure of rum, lime and sugar is older than any single named recipe, but Cox's story helped fix the drink in cocktail history. It became especially influential through Cuban bar culture and later through El Floridita in Havana. A well-made Daiquiri remains one of the clearest tests of balance in classic sour-style drinks.","ingredients":[{"name":"HOUSE WHITE RUM","amount":"50 ml"},{"name":"LIME JUICE","amount":"20 ml"},{"name":"SIMPLE SYRUP","amount":"15 ml"}],"method":"Shake / Double Strain","glass":"Nick & Nora","garnish":"Lime Wedge","category":"Sour","sales":183},{"name":"Dark and Stormy","allergens":"N/A","story":"The Dark 'n Stormy is strongly associated with Bermuda and Goslings Black Seal Rum. Goslings owns the trademark for the drink name in several markets, which is unusual for a classic cocktail. The origin story is commonly linked to sailors and ginger beer in Bermuda after the First World War, but the exact first serve is not clearly documented. Its identity depends on dark rum, ginger beer and lime in a refreshing highball format.","ingredients":[{"name":"GOSLING’S BLACK SEAL RUM","amount":"60 ml"},{"name":"FRESHLY SQUEEZED LIME WEDGE","amount":""},{"name":"GINGER BEER","amount":"90 ml"}],"method":"Build / Float Rum on Top","glass":"Nude Highball / ice chunk","garnish":"Lime Wedge","category":"Fizzy","sales":3},{"name":"Division Bell","allergens":"N/A","story":"The Division Bell was created in 2009 by Phil Ward at Mayahuel in New York. It is a modern mezcal variation inspired by the Last Word family of equal-parts sour and bitter drinks. The combination of mezcal, Aperol, lime and maraschino gives it smoke, citrus, bitterness and fruit. Its name is a reference to Pink Floyd's album The Division Bell, placing it firmly in modern cocktail culture.","ingredients":[{"name":"VIDA MEZCAL","amount":"30 ml"},{"name":"APEROL","amount":"20 ml"},{"name":"LIME JUICE","amount":"20 ml"},{"name":"MARASCHINO LIQUEUR","amount":"10 ml"}],"method":"Shake / Double Strain","glass":"Nick & Nora / no ice","garnish":"Grapefruit Coin","category":"Bitter","sales":0},{"name":"Delicious Sour","allergens":"3","story":"The Delicious Sour belongs to the older sour family built on spirit, citrus and sweetener. Recipes under this name appear in classic cocktail literature, although the exact origin is not clearly documented. Applejack and peach liqueur give the drink a fruit-forward profile while lemon keeps it in sour balance. It is best explained as a historical-style sour rather than a drink with a confirmed single creator.","ingredients":[{"name":"APPLE JACK","amount":"40 ml"},{"name":"PEACH LIQUEUR","amount":"20 ml"},{"name":"LEMON","amount":"20 ml"},{"name":"SIMPLE SYRUP","amount":"2 ml"},{"name":"EGG WHITE","amount":"20 ml"}],"method":"Shake / Double Strain","glass":"Nude Lowball / no ice","garnish":"Mint Sprig","category":"Sweet","sales":0},{"name":"Espresso Martini","allergens":"7","story":"The Espresso Martini was created by Dick Bradsell in London in the 1980s. It was originally called the Vodka Espresso and was made for a guest who wanted a drink that would wake her up. The later Martini name reflects the glass and the era's menu language rather than a connection to a true Martini. It became one of the defining modern classics because it combines vodka, coffee and sweetness in a clean after-dinner format.","ingredients":[{"name":"HOUSE VODKA","amount":"40 ml"},{"name":"KAHLUA","amount":"15 ml"},{"name":"SIMPLE SYRUP","amount":"5 ml"},{"name":"FRESH ESPRESSO","amount":"25 ml"}],"method":"Shake / Double Strain","glass":"Nude Pony / no ice","garnish":"3 Coffee Beans","category":"Sweet","sales":212},{"name":"El Presidente","allergens":"12","story":"El Presidente was popular in Cuba by the late 1910s and 1920s. Its exact author is debated, and different versions are linked to different Cuban presidents and bartenders. The drink can be understood as a Cuban answer to stirred, vermouth-led classics such as the Manhattan. Rum, vermouth, curaçao and grenadine give it a polished Havana hotel-bar character.","ingredients":[{"name":"HAVANA CLUB 7Y","amount":"40 ml"},{"name":"COINTREAU","amount":"20 ml"},{"name":"DOLIN RED","amount":"20 ml"},{"name":"GRENADINE","amount":"1 BSP"}],"method":"Stir","glass":"Nick & Nora / no ice","garnish":"Orange peel","category":"Sweet","sales":0},{"name":"French 75","allergens":"12","story":"The French 75 takes its name from the French 75-millimetre field gun used during the First World War. Early versions varied, but the gin, citrus, sugar and Champagne structure became the best-known form. Harry's New York Bar in Paris is often part of the drink's origin story, although details are not fully settled. The name suggests a drink with the light look of Champagne but a stronger impact than guests might expect.","ingredients":[{"name":"BEEFEATER","amount":"30 ml"},{"name":"LEMON JUICE","amount":"20 ml"},{"name":"SIMPLE SYRUP","amount":"15 ml"},{"name":"HOUSE CHAMPAGNE","amount":"Top"}],"method":"Shake / Double Strain","glass":"Rona Champagne","garnish":"Lemon Peel","category":"Sour","sales":25},{"name":"Fernandito","allergens":"N/A","story":"The Fernandito is the Argentine highball of Fernet-Branca and cola. It became especially associated with Córdoba before spreading across Argentina's wider drinking culture. The drink gained major visibility from the late twentieth century into the early 2000s. Its history is less about one named bartender and more about a national serve built from Italian bitter liqueur and cola.","ingredients":[{"name":"FERNET BRANCA","amount":"50 ml"},{"name":"COCA COLA","amount":"Top"}],"method":"Build in glass","glass":"Nude Long / Long Ice","garnish":"Not specified","category":"Bitter","sales":0},{"name":"French Martini","allergens":"N/A","story":"The French Martini is a modern cocktail from the late twentieth-century vodka era. Dale DeGroff helped popularise it in New York, including at Keith McNally's Pravda in the 1990s. The French part of the name comes mainly from the use of Chambord, a French raspberry liqueur. Despite the name, it is not a true Martini but a fruit-forward vodka sour served in a cocktail glass.","ingredients":[{"name":"HOUSE VODKA","amount":"40 ml"},{"name":"CHAMBORD","amount":"20 ml"},{"name":"PINEAPPLE JUICE","amount":"30 ml"}],"method":"Shake / Double Strain","glass":"Nick & Nora / no ice","garnish":"Lemon Twist","category":"Sweet","sales":0},{"name":"Green Park","allergens":"3, 9","story":"The Green Park was created in 2011 by Erik Lorincz at the American Bar at The Savoy in London. It sits in the modern gin sour family, using basil and bitters to give a fresh herbal accent. The name refers to Green Park, one of London's royal parks. It is a contemporary hotel-bar cocktail rather than a nineteenth-century classic.","ingredients":[{"name":"OLD TOM GIN","amount":"40 ml"},{"name":"LEMON JUICE","amount":"25 ml"},{"name":"SIMPLE SYRUP","amount":"15 ml"},{"name":"EGG WHITE","amount":"10 ml"},{"name":"CELERY BITTERS","amount":"3 dash"},{"name":"BASIL LEAVES","amount":"6 ml"}],"method":"Shake / Double Strain","glass":"Nude Coupetini / no ice","garnish":"Not specified","category":"Sour","sales":0},{"name":"Gin & Tonic","allergens":"N/A","story":"The Gin and Tonic grew from the use of quinine as an antimalarial bitter in tonic preparations. British colonial drinking culture in India helped make tonic water a familiar serve. Commercial carbonated tonic, including Schweppes Indian Tonic Water, made the drink easier to standardise in the nineteenth century. Gin made the bitter tonic more enjoyable, turning a medicinal association into one of the world's most enduring highballs.","ingredients":[{"name":"ASK FOR GIN PREFERENCE","amount":"40 ml"},{"name":"ASK FOR TONIC PREFERENCE","amount":""}],"method":"Build","glass":"Nude Highball / ice chunks","garnish":"Depends On Guest Preferences / Citrus Peel","category":"Fizzy","sales":0},{"name":"Garibaldi","allergens":"N/A","story":"The Garibaldi combines Campari with orange juice and is named after Giuseppe Garibaldi, a central figure in Italian unification. The red colour of Campari echoes the red shirts associated with Garibaldi's followers. The drink also symbolically connects northern Italy, through Campari, with southern Italian citrus. Its modern appeal comes from a simple build that becomes much better when the orange juice is fresh and fluffy.","ingredients":[{"name":"CAMPARI","amount":"50 ml"},{"name":"ORANGE JUICE","amount":"150 ml"}],"method":"Dry Shake","glass":"Nude Highball / ice chunk","garnish":"Orange Wedge","category":"Bitter","sales":0},{"name":"Gin Fizz","allergens":"N/A","story":"The Gin Fizz belongs to the nineteenth-century fizz family of sours lengthened with soda. Jerry Thomas helped popularise the category in print, and later manuals established many variations. Adding egg white makes a Silver Fizz, while adding yolk creates a Golden Fizz. The basic Gin Fizz remains a light, sparkling way to serve a gin sour long.","ingredients":[{"name":"HOUSE GIN","amount":"50 ml"},{"name":"LEMON JUICE","amount":"25 ml"},{"name":"SIMPLE SYRUP","amount":"20 ml"},{"name":"SODA WATER","amount":"Top"}],"method":"Shake / Double Strain","glass":"Nude Highball / Long Ice","garnish":"Long Lemon Peel","category":"Sour","sales":7},{"name":"Godfather","allergens":"8","story":"The Godfather became popular in the 1970s, around the same period as the novel and film of the same name. Its exact creator is not clearly documented. The drink's Italian-American association comes from the combination of Scotch whisky and amaretto. It is best described as a simple digestif-style cocktail whose name and era gave it lasting cultural recognition.","ingredients":[{"name":"HOUSE SCOTCH","amount":"40 ml"},{"name":"AMARETTO DISARONNO","amount":"20 ml"},{"name":"ANGOSTURA BITTERS","amount":"1 dash"}],"method":"Stir","glass":"Nude Lowball / ice chunks","garnish":"Lemon Peel","category":"Boozy","sales":0},{"name":"Golden Dream","allergens":"7","story":"The Golden Dream is a creamy dessert cocktail associated with the 1960s. Its exact origin is not clearly documented in the major historical sources, although it became known through international cocktail competition and IBA-style lists. Galliano, orange liqueur and cream place it firmly in the sweet after-dinner style of the period. It works best as a retro dessert drink rather than a pre-Prohibition classic.","ingredients":[{"name":"GALLIANO","amount":"20 ml"},{"name":"ORANGE JUICE","amount":"20 ml"},{"name":"COINTREAU","amount":"20 ml"},{"name":"CREAM","amount":"20 ml"}],"method":"Shake","glass":"Savage Pony","garnish":"Not specified","category":"Sweet","sales":0},{"name":"Gimlet","allergens":"N/A","story":"The Gimlet is closely linked to the British Navy and the preservation of lime juice. Rose's Lime Cordial, patented in the nineteenth century, made sweetened preserved lime practical for long voyages. The exact naming story is disputed, with one tradition connecting it to Surgeon Admiral Sir Thomas Gimlette. In modern bars the drink is usually presented as a sharp gin-and-lime classic with naval roots.","ingredients":[{"name":"PLYMOUTH GIN","amount":"50 ml"},{"name":"LIME JUICE","amount":"20 ml"},{"name":"SIMPLE SYRUP","amount":"15 ml"}],"method":"Shake / Double Strain","glass":"Nick & Nora / no ice","garnish":"Lime Wedge","category":"Sour","sales":4},{"name":"Grasshopper","allergens":"7","story":"The Grasshopper is strongly associated with New Orleans and Tujague's restaurant. One common history credits Philibert Guichet with creating or popularising it around the early twentieth century. The drink became especially popular in the mid-century era of creamy after-dinner cocktails. Its green colour and mint-chocolate profile make it one of the clearest dessert cocktails in the classic canon.","ingredients":[{"name":"CRÈME DE CACAO WHITE","amount":"20 ml"},{"name":"CRÈME DE MENTHE","amount":"20 ml"},{"name":"CREAM","amount":"20 ml"}],"method":"Shake","glass":"Savage Pony","garnish":"Mint Leaves","category":"Sweet","sales":0},{"name":"French Connection","allergens":"8","story":"The French Connection is a simple two-ingredient digestif of Cognac and amaretto. Its name is widely linked to the 1971 film The French Connection. The exact creator is not clearly documented, which is common with very simple late twentieth-century drinks. The drink works as a cultural reference as much as a recipe, connecting French brandy with Italian almond liqueur.","ingredients":[{"name":"FERRAND 10 GENERATIONS","amount":"35 ml"},{"name":"DISARONNO","amount":"35 ml"}],"method":"Build in glass","glass":"Nude Lowball / ice block","garnish":"Not specified","category":"Boozy","sales":0},{"name":"House Negroni","allergens":"12","story":"The Negroni is usually linked to Florence around 1919 and to Count Camillo Negroni. The common story says he asked bartender Fosco Scarselli to strengthen an Americano by replacing soda water with gin. The exact documentation is debated, so the story should be presented as the accepted tradition rather than absolute fact. Its equal-parts structure of gin, bitter aperitivo and sweet vermouth made it one of the defining aperitif cocktails of the twentieth century.","ingredients":[{"name":"HOUSE GIN","amount":"25 ml"},{"name":"CAMPARI","amount":"25 ml"},{"name":"PUNT E MES","amount":"15 ml"},{"name":"CINZANO ROSSO","amount":"15 ml"}],"method":"Stir","glass":"Nude Lowball / ice block","garnish":"Orange Coin","category":"Bitter","sales":469},{"name":"Hemingway Daiquiri","allergens":"N/A","story":"The Hemingway Daiquiri is tied to El Floridita in Havana and Ernest Hemingway's drinking there. The story says Hemingway preferred a Daiquiri without sugar and with a stronger rum measure. Later versions added grapefruit and maraschino, creating the style often called the Papa Doble or Hemingway Daiquiri. The exact details vary by source, but the drink remains a central link between Cuban cocktail culture and literary mythology.","ingredients":[{"name":"HAVANA CLUB 3YO","amount":"40 ml"},{"name":"LIME JUICE","amount":"15 ml"},{"name":"GRAPEFRUIT JUICE","amount":"40 ml"},{"name":"LUXARDO MARASCHINO","amount":"15 ml"},{"name":"SIMPLE SYRUP","amount":"10 ml"}],"method":"Shake / Double Strain","glass":"Nude Water / ice sphere","garnish":"Grapefruit Coin","category":"Sour","sales":0},{"name":"Horse Neck","allergens":"N/A","story":"The Horse's Neck began in the late nineteenth century as a non-alcoholic ginger ale drink with a long lemon peel. Brandy, bourbon or rye was later added, turning it into a proper cocktail. The long peel curling around the glass gives the drink its name. It is a useful example of how a simple temperance-era highball became a spirit-forward classic.","ingredients":[{"name":"FERRAND 10 GENERATIONS","amount":"40 ml"},{"name":"ANGOSTURA BITTERS","amount":"2 dash"},{"name":"GINGER ALE","amount":"Top"}],"method":"Build in glass","glass":"Nude Highball / Long Ice","garnish":"Long Lemon Peel","category":"Sour","sales":0},{"name":"Hanky Panky","allergens":"12","story":"The Hanky Panky was created by Ada Coleman at the American Bar at The Savoy in London. She made it for the actor Sir Charles Hawtrey, who reportedly praised it with the phrase that gave the drink its name. The recipe is essentially a sweet Martini sharpened with Fernet-Branca. It remains an important example of an early twentieth-century classic created by one of the most influential women in bar history.","ingredients":[{"name":"MALFY GIN","amount":"35 ml"},{"name":"PUNT E MES","amount":"35 ml"},{"name":"FERNET BRANCA","amount":"5 ml"}],"method":"Stir","glass":"Nick & Nora / no ice","garnish":"Orange peel","category":"Bitter","sales":0},{"name":"Ilegal","allergens":"N/A","story":"The exact origin of this cocktail is not clearly documented in the major historical sources. It appears to be a modern mezcal drink built around the sour and bitter structure used in many contemporary classics. Mezcal gives the drink smoke and earthiness, while citrus keeps it bright and serviceable. It should be presented as a modern mezcal cocktail rather than a drink with a verified nineteenth- or twentieth-century origin story.","ingredients":[{"name":"MEZCAL VIDA","amount":"30 ml"},{"name":"PLANTARAY O.F.T.D","amount":"15 ml"},{"name":"VELVET FALERNUM","amount":"15 ml"},{"name":"FRESH LIME JUICE","amount":"20 ml"},{"name":"LUXARDO MARASCHINO","amount":"1 BSP"},{"name":"SIMPLE SYRUP","amount":"15 ml"}],"method":"Shake","glass":"Terracotta Mug","garnish":"Not specified","category":"Sour","sales":0},{"name":"Irish Coffee","allergens":"7","story":"Irish Coffee is widely attributed to Joe Sheridan at Foynes Airbase in County Limerick during the 1940s. It was created as a warming drink for travellers facing cold Atlantic weather. The serve later became famous in the United States through the Buena Vista in San Francisco. Its lasting appeal comes from the clear balance of hot coffee, Irish whiskey, sugar and lightly floated cream.","ingredients":[{"name":"JAMESON BLACK","amount":"50 ml"},{"name":"ESPRESSO LUNGO","amount":"150 ml"},{"name":"SIMPLE SYRUP","amount":"15 ml"},{"name":"CREAM FLOAT","amount":"Top"}],"method":"Build / Float Cream","glass":"Irish Coffee / no ice","garnish":"Not specified","category":"Sweet","sales":5},{"name":"Jungle Bird","allergens":"N/A","story":"The Jungle Bird was created at the Kuala Lumpur Hilton in the 1970s. It is commonly credited to Jeffrey Ong and was served as a welcome drink at the hotel. The recipe is unusual because it combines tropical rum-and-pineapple flavour with the bitterness of Campari. That bitter-tropical structure helped it become a favourite in the modern tiki revival.","ingredients":[{"name":"HAVANA 7YO","amount":"30 ml"},{"name":"CAMPARI","amount":"15 ml"},{"name":"LIME JUICE","amount":"20 ml"},{"name":"PINEAPPLE JUICE","amount":"40 ml"},{"name":"SIMPLE SYRUP","amount":"10 ml"}],"method":"Shake / Double Strain","glass":"Nude Water / ice block","garnish":"Mint Sprig / Dry Pineapple","category":"Bitter","sales":0},{"name":"Last Word","allergens":"N/A","story":"The Last Word dates to the Detroit Athletic Club before Prohibition. It later fell into obscurity until Murray Stenson revived it at the Zig Zag Cafe in Seattle in the early 2000s. The equal-parts structure of gin, Chartreuse, maraschino and lime made it especially attractive to modern bartenders. Its comeback helped inspire many contemporary equal-parts variations.","ingredients":[{"name":"TANQUERAY GIN","amount":"20 ml"},{"name":"LIME JUICE","amount":"20 ml"},{"name":"GREEN CHARTREUSE","amount":"20 ml"},{"name":"MARASCHINO","amount":"20 ml"}],"method":"Shake / Double Strain","glass":"Nick & Nora / no ice","garnish":"Amarena Cherry","category":"Bitter","sales":0},{"name":"Tom Collins / John Collins","allergens":"N/A","story":"The Collins family became widely known in the nineteenth century. Jerry Thomas printed a Tom Collins recipe in his 1876 bartending guide, helping standardise the drink. The John Collins name is often connected with earlier gin punch and London hotel-bar traditions. Today the Tom Collins is understood as a sparkling gin sour served long over ice.","ingredients":[{"name":"OLD TOM GIN","amount":"45 ml"},{"name":"LEMON JUICE","amount":"20 ml"},{"name":"SIMPLE SYRUP","amount":"15 ml"},{"name":"SODA","amount":"Top"}],"method":"Shake / Double Strain","glass":"Nude Highball / Long Ice","garnish":"Lemon Wedge / Maraschino Cherry","category":"Sour","sales":0},{"name":"Lemon Drop","allergens":"N/A","story":"The Lemon Drop was created in San Francisco in the 1970s and is often linked to Norman Jay Hobday of Henry Africa's. It belongs to the era when vodka cocktails became brighter, sweeter and more accessible. The drink takes its name from the lemon drop candy, which explains the sweet-sour profile and sugared rim. In a well-made version, fresh lemon keeps the drink crisp rather than merely sweet.","ingredients":[{"name":"ABSOLUT LEMON","amount":"40 ml"},{"name":"LEMON JUICE","amount":"15 ml"},{"name":"COINTREAU","amount":"15 ml"},{"name":"SIMPLE SYRUP","amount":"10 ml"}],"method":"Shake / Double Strain","glass":"Savage Pony / no ice","garnish":"Lemon Coin","category":"Sour","sales":10},{"name":"Lynchburg Lemonade","allergens":"N/A","story":"Lynchburg Lemonade is a modern American whiskey highball associated with the Jack Daniel's brand and Lynchburg, Tennessee. The drink is commonly linked to Tony Mason in Alabama in the 1980s, although brand promotion later shaped its wider fame. Its history also includes a well-known legal dispute over recipe credit and marketing. For guests, it can be presented as a citrusy whiskey lemonade built for long, easy service.","ingredients":[{"name":"JACK DANIELS N.40","amount":"45 ml"},{"name":"COINTREAU","amount":"15 ml"},{"name":"LEMON JUICE","amount":"20 ml"},{"name":"SPRITE","amount":"Top"}],"method":"Build in glass","glass":"Nude Hb / Ice","garnish":"Orange Wedge","category":"Sweet","sales":0},{"name":"Long Island Iced Tea","allergens":"N/A","story":"The modern Long Island Iced Tea is widely credited to Robert Butt at the Oak Beach Inn on Long Island in the 1970s. Older stories exist, but the 1970s version is the one most connected with the drink's modern reputation. Despite its name, the drink contains no tea; the colour comes from cola. Its challenge is balance, because several spirits must still drink like a bright, citrus-led highball.","ingredients":[{"name":"HOUSE VODKA","amount":"10 ml"},{"name":"HOUSE GIN","amount":"10 ml"},{"name":"HAVANA CLUB 3Y","amount":"10 ml"},{"name":"TEQUILA BLANCO","amount":"10 ml"},{"name":"COINTREAU","amount":"10 ml"},{"name":"SIMPLE SYRUP","amount":"10 ml"},{"name":"LEMON JUICE","amount":"20 ml"},{"name":"COCA COLA","amount":"Top"}],"method":"Shake / Double Strain","glass":"Nude Highball / ice chunk","garnish":"Lemon Wedge","category":"Sweet","sales":50},{"name":"Manhattan","allergens":"12","story":"The Manhattan is one of the central American cocktails of the nineteenth century. Its exact origin is disputed, although many stories connect it with New York and the Manhattan Club. The basic form of whiskey, sweet vermouth and bitters helped define the stirred cocktail template. Rye is historically common, while bourbon versions became popular in later American service.","ingredients":[{"name":"HOUSE BOURBON / GUEST PREFERENCE","amount":"50 ml"},{"name":"DOLIN RED","amount":"20 ml"},{"name":"ANGOSTURA BITTERS","amount":"3 dash"}],"method":"Stir","glass":"Nick & Nora / no ice","garnish":"Maraschino Cherry","category":"Boozy","sales":25},{"name":"Manhattan - Perfect","allergens":"12","story":"The Perfect Manhattan is a variation on the classic Manhattan rather than a separate origin story. Perfect means that the vermouth is split between sweet and dry, not that the drink is objectively better. The style reflects the late nineteenth- and early twentieth-century habit of naming vermouth variations precisely. It is useful for guests who want the Manhattan structure with a slightly drier and more aromatic finish.","ingredients":[{"name":"HOUSE BOURBON / GUEST PREFERENCE","amount":"50 ml"},{"name":"DOLIN RED","amount":"15 ml"},{"name":"DOLIN DRY","amount":"15 ml"},{"name":"ANGOSTURA BITTERS","amount":"3 dash"}],"method":"Stir","glass":"Savage Pony / no ice","garnish":"Orange Coin","category":"Boozy","sales":0},{"name":"Leaving Manhattan","allergens":"12","story":"The exact origin of this variation is not clearly documented in major cocktail history sources. The name clearly signals a departure from the Manhattan template rather than an older classic with a fixed story. Like many modern Manhattan riffs, it uses the stirred whiskey-vermouth format as a starting point. It should be described as a house-style variation unless a specific creator or bar is documented locally.","ingredients":[{"name":"FOUR ROSES","amount":"50 ml"},{"name":"PUNT E MES","amount":"30 ml"},{"name":"BROWN CACAO","amount":"10 ml"},{"name":"LAPHROAIG 10YO","amount":"5 ml"},{"name":"ORANGE BITTERS","amount":"2 dash"}],"method":"Stir","glass":"Nude Lowball / ice block","garnish":"Orange Coin","category":"Boozy","sales":0},{"name":"House Spice Margarita","allergens":"N/A","story":"The exact origin of this house-style variation is not clearly documented in major cocktail sources. It belongs to the broader Margarita family, which itself descends from the Daisy style of spirit, citrus and liqueur. Spice is a modern bar addition that changes the guest experience without changing the drink's sour structure. It should be explained as a contemporary spicy Margarita variation rather than a separate historical classic.","ingredients":[{"name":"MEZCAL VIDA","amount":"10 ml"},{"name":"HOUSE TEQUILA","amount":"30 ml"},{"name":"COINTREAU","amount":"10 ml"},{"name":"AGAVE SYRUP","amount":"5 ml"},{"name":"LIME JUICE","amount":"20 ml"},{"name":"CHILLI TINCTURE","amount":"3 dash"},{"name":"SALINE SOLUTION","amount":"2 dash"}],"method":"Shake / Double Strain","glass":"Nude Lowball / ice block","garnish":"Yuzu Salt / Lime Wedge","category":"Sour","sales":0},{"name":"Margarita","allergens":"N/A","story":"The Margarita's exact origin is disputed, with several competing stories from Mexico and the United States in the 1930s and 1940s. Its name means daisy in Spanish, and the drink fits the Daisy formula of spirit, citrus and liqueur. Tequila, lime and orange liqueur became the combination that defined the modern recipe. Because no single story is fully proven, it is best presented as a tequila Daisy that became the most famous tequila cocktail in the world.","ingredients":[{"name":"HOUSE TEQUILA","amount":"40 ml"},{"name":"LIME JUICE","amount":"25 ml"},{"name":"COINTREAU","amount":"10 ml"},{"name":"AGAVE SYRUP","amount":"5 ml"},{"name":"SALINE SOLUTION","amount":"1 dash"}],"method":"Shake / Double Strain","glass":"Nick & Nora","garnish":"Salt Rim / Lime Wedge","category":"Sour","sales":174},{"name":"Martinez","allergens":"12","story":"The Martinez is often treated as a bridge between the Manhattan and the Martini. It appears in late nineteenth-century cocktail books, including O. H. Byron's 1884 Modern Bartender's Guide. The exact origin is disputed, with stories connecting it to California and to New York-style bar culture. Sweet vermouth, gin, maraschino and bitters give it a richer profile than the later dry Martini.","ingredients":[{"name":"OLD TOM GIN","amount":"40 ml"},{"name":"CARPANO ANTICA FORMULA","amount":"40 ml"},{"name":"MARASCHINO","amount":"1 BSP"},{"name":"ANGOSTURA BITTERS","amount":"2 dash"},{"name":"DASH OF ORANGE BITTERS","amount":"2 dash"}],"method":"Stir","glass":"Nick & Nora / no ice","garnish":"Lemon Twist","category":"Boozy","sales":0},{"name":"Mint Julep","allergens":"N/A","story":"The Mint Julep has roots in eighteenth- and nineteenth-century American drinking culture. It became strongly associated with the American South and later with the Kentucky Derby. Early juleps could use different spirits, but bourbon became the dominant modern base. The drink's ritual of mint, crushed ice and a metal cup is as important to its identity as the recipe itself.","ingredients":[{"name":"HOUSE BOURBON","amount":"60 ml"},{"name":"SIMPLE SYRUP","amount":"15 ml"},{"name":"MINT LEAVES","amount":"8 pcs"}],"method":"Build","glass":"Julep Mug / Crushed Ice","garnish":"Mint Sprig","category":"Boozy","sales":3},{"name":"Moscow Mule","allergens":"N/A","story":"The Moscow Mule was created in the early 1940s as vodka was being promoted in the United States. The story usually brings together John Martin of Smirnoff and Jack Morgan of Cock 'n Bull ginger beer. The copper mug became a clever marketing signature and helped the drink stand out visually. Its lasting appeal comes from a simple combination of vodka, ginger beer and lime served cold and sharp.","ingredients":[{"name":"HOUSE VODKA","amount":"50 ml"},{"name":"LIME JUICE","amount":"20 ml"},{"name":"GINGER BEER","amount":"Top"}],"method":"Build","glass":"Julep Mug / Ice Cubes & Crushed","garnish":"2 Cucumber Slices / Mint Sprig","category":"Sour","sales":88},{"name":"Mojito","allergens":"N/A","story":"The Mojito is linked to Cuban drinking culture and to earlier drinks made with aguardiente, lime, sugar and mint. One popular legend connects an ancestor of the drink to Sir Francis Drake, although the historical details are uncertain. The modern rum-based Mojito developed through Cuban bars and became strongly associated with Havana. Its appeal is the direct balance of rum, mint, lime, sugar and soda in a long refreshing serve.","ingredients":[{"name":"HAVANA CLUB 3Y","amount":"40 ml"},{"name":"BROWN SUGAR","amount":"2 BSP"},{"name":"LIME PIECES","amount":"3 ml"},{"name":"MINT LEAVES","amount":"12 pcs"},{"name":"SODA WATER","amount":"Top"}],"method":"Build / Muddle / Top Soda","glass":"Nude Highball / Crushed Ice","garnish":"Mint Sprig / Dry Lime","category":"Sour","sales":78},{"name":"Mai Tai","allergens":"8","story":"The Mai Tai was created in 1944 by Victor Bergeron, better known as Trader Vic. The famous story says a Tahitian guest praised it with the phrase mai tai roa ae, meaning something close to very good or out of this world. The original used a prized aged Jamaican rum that soon became difficult to source. Later recipes changed, but the classic identity remains rum, lime, orange curaçao, orgeat and a dry tropical balance.","ingredients":[{"name":"HAVANA 7YO","amount":"20 ml"},{"name":"TROIS RIVIERES CUVEE D OC","amount":"20 ml"},{"name":"LIME JUICE","amount":"20 ml"},{"name":"COINTREAU","amount":"10 ml"},{"name":"ALMOND ORGEAT","amount":"10 ml"},{"name":"SIMPLE SYRUP","amount":"10 ml"},{"name":"ANGOSTURA BITTERS","amount":"1 dash"}],"method":"Shake / Double Strain","glass":"Terracotta Mug / Crushed Ice","garnish":"Mint Sprig / Dry Lime","category":"Sweet","sales":12},{"name":"Dry Martini","allergens":"12","story":"The Dry Martini evolved from earlier vermouth-and-gin drinks such as the Martinez. By the early twentieth century, drier gin and drier vermouth pushed the drink toward the austere form recognised today. Its history is full of personal preferences, from ratios to garnish to shaking or stirring. It remains a benchmark because small changes in dilution, temperature and vermouth dramatically change the result.","ingredients":[{"name":"ASK FOR GIN OR VODKA","amount":"60 ml"},{"name":"ASK FOR VERMOUTH","amount":"20 ml"},{"name":"ASK FOR DASH OF ORANGE BIT.","amount":"1 dash"},{"name":"ASK FOR OLIVE OR TWIST","amount":""}],"method":"Stir","glass":"Nick & Nora / no ice","garnish":"Olive or Lemon Twist","category":"Boozy","sales":78},{"name":"Wet Martini","allergens":"12","story":"The Wet Martini is a variation within the Martini family rather than a separate drink with one documented creator. Wet means a higher proportion of dry vermouth compared with the very dry modern style. Historically, earlier Martinis often used more vermouth than many contemporary serves. It is a useful style for guests who want a more aromatic, less spirit-dominant Martini.","ingredients":[{"name":"ASK FOR GIN OR VODKA","amount":"50 ml"},{"name":"ASK FOR VERMOUTH","amount":"25 ml"},{"name":"ORANGE BITTERS","amount":"1 dash"},{"name":"ASK FOR OLIVE OR TWIST","amount":""}],"method":"Stir","glass":"Nick & Nora / no ice","garnish":"Olive or Lemon Twist","category":"Boozy","sales":0},{"name":"Dirty Martini","allergens":"12","story":"The Dirty Martini is a twentieth-century variation of the Martini made with olive brine. Its exact origin is not clearly documented, although olive garnish and savoury Martini variations became increasingly common over time. The brine changes the drink from crisp and aromatic to saline and savoury. It is best introduced as a modern Martini preference rather than an older canonical formula.","ingredients":[{"name":"ASK FOR GIN OR VODKA","amount":"60 ml"},{"name":"ASK FOR VERMOUTH","amount":"10 ml"},{"name":"OLIVE BRINE","amount":"10 ml"},{"name":"OLIVE BITTERS","amount":"2 dash"}],"method":"Stir","glass":"Nick & Nora / no ice","garnish":"3 Olives on the Side","category":"Boozy","sales":0},{"name":"Vesper Martini","allergens":"12","story":"The Vesper first appeared in Ian Fleming's 1953 James Bond novel Casino Royale. Bond names the drink after Vesper Lynd and specifies gin, vodka and Kina Lillet. Because Kina Lillet is no longer made in its original form, modern versions use Lillet Blanc or similar substitutes. The famous instruction to shake it, not stir it, is part of the drink's literary identity as much as its recipe.","ingredients":[{"name":"HOUSE GIN","amount":"40 ml"},{"name":"HOUSE VODKA","amount":"20 ml"},{"name":"LILLET BLANC","amount":"10 ml"}],"method":"Shake / Double Strain","glass":"Nick & Nora / no ice","garnish":"Lemon Peel","category":"Boozy","sales":0},{"name":"Mimosa","allergens":"12","story":"The Mimosa is usually linked to the 1920s, with both London and Paris appearing in origin stories. Buck's Fizz at Buck's Club in London used a similar mixture of sparkling wine and orange juice. Frank Meier at the Ritz in Paris is often connected with the Mimosa name. Because the exact origin is not settled, it is safest to describe it as a 1920s sparkling orange drink that became a brunch classic.","ingredients":[{"name":"FRESH ORANGE JUICE","amount":"80 ml"},{"name":"HOUSE PROSECCO","amount":"80 ml"}],"method":"Build in glass","glass":"Rona Prosecco","garnish":"Orange peel","category":"Sweet","sales":12},{"name":"Monkey Gland","allergens":"N/A","story":"The Monkey Gland is usually credited to Harry MacElhone in 1920s Paris. Its name refers to the controversial experiments of Serge Voronoff, who claimed that grafting monkey gland tissue could restore vitality. The drink combines gin, orange, grenadine and absinthe in a style typical of the period's fascination with novelty names. Its strange backstory often interests guests more than the recipe itself.","ingredients":[{"name":"HOUSE GIN","amount":"45 ml"},{"name":"FRESH ORANGE JUICE","amount":"45 ml"},{"name":"ABSINTHE","amount":"10 ml"},{"name":"GRENADINE","amount":"10 ml"}],"method":"Shake","glass":"Nick & Nora","garnish":"Orange Wedge","category":"Boozy","sales":0},{"name":"Mary Pickford","allergens":"N/A","story":"The Mary Pickford is a Prohibition-era Cuban cocktail named after the silent film star. It is usually linked to Havana hotel bars in the 1920s, when American visitors and celebrities helped shape Cuban cocktail culture. Several bartenders have been credited, so the exact authorship is not completely settled. Pineapple, rum, grenadine and maraschino give the drink the bright, tropical style associated with that era.","ingredients":[{"name":"HAVANA 3YO","amount":"50 ml"},{"name":"PINEAPPLE JUICE","amount":"45 ml"},{"name":"LUXARDO MARASCHINO","amount":"8 ml"},{"name":"GRENADINE","amount":"5 ml"}],"method":"Shake / Double Strain","glass":"Nude Coupetini / no ice","garnish":"Not specified","category":"Sweet","sales":0},{"name":"Hot Toddy","allergens":"N/A","story":"The Hot Toddy belongs to an old family of hot spirit drinks rather than to one confirmed inventor. Its origins are often linked to Britain, Scotland and India, but the exact path is disputed. Whiskey, hot water, sugar or honey and citrus made it useful as a cold-weather comfort drink. It should be presented as a historic hot mixed drink with medicinal associations, not as a cure.","ingredients":[{"name":"JAMESON BLACK BARREL","amount":"50 ml"},{"name":"FILTERED WATER","amount":"100 ml"},{"name":"FRESH LEMON","amount":"10 ml"},{"name":"HONEY","amount":"20 ml"},{"name":"DASH OF OLD FASHIONED BITTERS","amount":"3 dash"}],"method":"Milk Jug / Steamed","glass":"Latte Gls","garnish":"Not specified","category":"Sweet","sales":0},{"name":"Naked n Famous","allergens":"N/A","story":"The Naked and Famous was created by Joaquín Simó at Death & Co. in New York in 2011. Simó described it as a Last Word-style drink, but with mezcal, Aperol, yellow Chartreuse and lime. The equal-parts structure makes the drink easy to remember while the flavours are modern and bold. It became a contemporary classic because smoke, bitterness, herbs and citrus all stay in balance.","ingredients":[{"name":"VIDA MEZCAL","amount":"25 ml"},{"name":"YELLOW CHARTREUSE","amount":"25 ml"},{"name":"APEROL","amount":"25 ml"},{"name":"LIME JUICE","amount":"25 ml"}],"method":"Shake / Double Strain","glass":"Nick & Nora / no ice","garnish":"Lime Wedge","category":"Bitter","sales":0},{"name":"New York Sour","allergens":"12","story":"The New York Sour is a nineteenth-century whiskey sour finished with a red wine float. It appeared under several names, including Continental Sour, Southern Whiskey Sour and Claret Snap. The exact origin is not clearly documented, but the style was well established by the late 1800s. The wine float adds colour, aroma and tannin without changing the sour foundation of the drink.","ingredients":[{"name":"BULLEIT RYE","amount":"50 ml"},{"name":"LEMON JUICE","amount":"25 ml"},{"name":"SIMPLE SYRUP","amount":"20 ml"},{"name":"FLOAT OF RED WINE","amount":"10 ml"}],"method":"Shake / Double Strain","glass":"Nude Lowball / Ice Cubes","garnish":"Not specified","category":"Sour","sales":0},{"name":"Negroni Sbagliato","allergens":"12","story":"Sbagliato means mistaken in Italian. The drink is usually credited to Mirko Stocchetto at Bar Basso in Milan, where sparkling wine was used in place of gin in a Negroni-style build. The story is often told as an accidental substitution, although exact details vary by source. The result is lighter and more sparkling than a Negroni while keeping the bitter-vermouth profile.","ingredients":[{"name":"CAMPARI","amount":"30 ml"},{"name":"PUNT E MES","amount":"30 ml"},{"name":"PROSECCO","amount":"Top"}],"method":"Build / Top with Prosecco","glass":"Nude Highball / ice block","garnish":"Orange Coin","category":"Bitter","sales":6},{"name":"Old Fashioned (rum)","allergens":"12","story":"The Rum Old Fashioned is a variation on the original cocktail template of spirit, sugar, water and bitters. It does not have one fixed historical origin in the way the whiskey Old Fashioned does. The format works especially well with fuller rums because the spirit carries most of the drink. It should be presented as a rum interpretation of a historic structure rather than a separate nineteenth-century recipe.","ingredients":[{"name":"ASK FOR RUM","amount":"60 ml"},{"name":"DEMERARA SYRUP","amount":"5 ml"},{"name":"ANGOSTURA BITTERS","amount":"2 dash"},{"name":"FLOAT OF PX SHERRY","amount":"10 ml"}],"method":"Stir","glass":"Nude Lowball / ice block","garnish":"Orange peel / Maraschino Cherry","category":"Boozy","sales":0},{"name":"Old Fashioned (whiskey)","allergens":"N/A","story":"The Old Fashioned grew from the early definition of a cocktail as spirit, sugar, water and bitters. By the late nineteenth century, some drinkers asked for their whiskey cocktail in the old-fashioned style to avoid newer liqueur-heavy variations. The name therefore describes a return to a simpler form rather than a single moment of invention. It remains one of the clearest ways to showcase whiskey with minimal modification.","ingredients":[{"name":"ASK FOR WHISK(E)Y","amount":"60 ml"},{"name":"DEMERARA SYRUP","amount":"2 BSP"},{"name":"DASH OF ANGOSTURA BITTERS","amount":"2 dash"},{"name":"DASH OF ORANGE BITTERS","amount":"1 dash"}],"method":"Long Stir","glass":"Nude Lowball / ice block","garnish":"Orange peel / Cherry","category":"Boozy","sales":141},{"name":"Old Cuban","allergens":"12","story":"The Old Cuban was created by Audrey Saunders in New York in the early 2000s. It can be understood as a refined bridge between the Mojito and a Champagne cocktail. Aged rum, mint, lime, bitters and sparkling wine give it Cuban inspiration with a more elegant presentation. It became a modern classic because it feels celebratory while keeping the freshness of a rum sour.","ingredients":[{"name":"HAVANA CLUB 7Y","amount":"40 ml"},{"name":"LIME JUICE","amount":"20 ml"},{"name":"SIMPLE SYRUP","amount":"15 ml"},{"name":"ANGOSTURA BITTERS","amount":"2 dash"},{"name":"MINT LEAVES","amount":"6 pcs"},{"name":"PROSECCO","amount":"Top"}],"method":"Shake / Double Strain","glass":"Prosecco Glass / no ice","garnish":"Mint Leaf","category":"Sweet","sales":0},{"name":"Painkiller","allergens":"N/A","story":"The Painkiller is closely associated with the Soggy Dollar Bar on Jost Van Dyke in the British Virgin Islands. Daphne Henderson is central to the drink's origin story, while Pusser's Rum later helped popularise and protect the name. It is related to the Piña Colada family but uses orange juice, pineapple, coconut and dark rum in a richer island style. The exact recipe has brand associations, so it is best discussed as a Caribbean rum classic with a strong place identity.","ingredients":[{"name":"NAVY RUM","amount":"40 ml"},{"name":"PINEAPPLE","amount":"10 ml"},{"name":"ORANGE JUICE","amount":"90 ml"},{"name":"DASH OF MOLE BITTERS","amount":"2 dash"}],"method":"Shake / Double Strain","glass":"Nude Lowball / Ice Cubes","garnish":"Mint Sprig / Dry Orange Nutmeg","category":"Sweet","sales":3},{"name":"Paloma","allergens":"N/A","story":"The Paloma is one of Mexico's most popular tequila highballs. Its exact origin is not clearly documented, and the common attribution to Don Javier Delgado Corona is not firmly proven. Grapefruit soda, lime and tequila made the drink practical, refreshing and easy to reproduce. It is often more representative of everyday Mexican tequila drinking than the Margarita.","ingredients":[{"name":"TEQUILA BLANCO","amount":"40 ml"},{"name":"LIME JUICE","amount":"5 ml"},{"name":"SALINE SOLUTION","amount":"2 dash"},{"name":"GRAPEFRUIT SODA","amount":"Top"}],"method":"Build","glass":"Nude Highball / Long Ice","garnish":"Salt Rim / Lime Wedge","category":"Fizzy","sales":21},{"name":"Pisco Sour","allergens":"3","story":"The Pisco Sour is most often credited to Victor Morris, an American bartender working in Lima in the early twentieth century. Peru and Chile both have strong pisco traditions, so national claims around the drink can be sensitive. The modern Peruvian style with egg white and bitters became the internationally recognised form. Its story should be presented with respect for the disputed regional context rather than as a simple one-country claim.","ingredients":[{"name":"PISCO","amount":"40 ml"},{"name":"LEMON JUICE","amount":"20 ml"},{"name":"SIMPLE SYRUP","amount":"15 ml"},{"name":"EGG WHITE","amount":"20 ml"}],"method":"Shake / Double Strain","glass":"Nude Pony / no ice","garnish":"3 Dots Angostura Bitters","category":"Sour","sales":7},{"name":"Penicillin","allergens":"N/A","story":"The Penicillin was created by Sam Ross at Milk & Honey in New York in 2005. It began as a riff on the Gold Rush, using Scotch whisky, honey, ginger and lemon. A float of peated Islay whisky gives the drink its smoky aromatic signature. It became one of the most influential modern classics because it is easy to understand but layered in flavour.","ingredients":[{"name":"CHIVAS REGAL 12","amount":"40 ml"},{"name":"LEMON JUICE","amount":"20 ml"},{"name":"HONEY WATER","amount":"10 ml"},{"name":"GINGER CORDIAL","amount":"10 ml"},{"name":"DEACON FLOAT","amount":"10 ml"}],"method":"Shake / Double Strain / Float","glass":"Nude Lowball / ice block","garnish":"Candied Ginger","category":"Sour","sales":31},{"name":"Piña Colada","allergens":"N/A","story":"The Piña Colada is strongly associated with Puerto Rico and mid-twentieth-century Caribbean hotel culture. Ramón Monchito Marrero at the Caribe Hilton in San Juan is one of the most cited creators, with 1954 often given as the date. Barrachina restaurant in Old San Juan also claims a role, so the exact origin is disputed. The drink became Puerto Rico's national cocktail and remains the defining combination of rum, pineapple and coconut.","ingredients":[{"name":"HAVANA CLUB 3Y","amount":"40 ml"},{"name":"PINEAPPLE JUICE","amount":"60 ml"},{"name":"LIME JUICE","amount":"15 ml"},{"name":"COCONUT SYRUP","amount":"15 ml"},{"name":"DROP SALINE SOLUTION","amount":"2 ml"},{"name":"ANGOSTURA BITTERS","amount":"1 dash"}],"method":"Shake / Double Strain","glass":"Nude Highball / ice chunk","garnish":"Mint Sprig / Dry Pineapple","category":"Sweet","sales":28},{"name":"Pornstar Martini","allergens":"N/A","story":"Created by Douglas Ankrah in London in the early 2000s, the Pornstar Martini became one of the defining modern cocktails of that decade. Despite the name, it is not a true Martini, but a vanilla and passion fruit vodka sour-style drink. The side serve of Prosecco is traditionally served separately rather than mixed into the glass. Its dry effervescence refreshes the palate and balances the cocktail's sweeter tropical profile.","ingredients":[{"name":"VANILLA VODKA","amount":"40 ml"},{"name":"PASSION FRUIT PURÉE","amount":"20 ml"},{"name":"VANILLA SYRUP","amount":"20 ml"},{"name":"LIME JUICE","amount":"20 ml"}],"method":"Shake / Double Strain","glass":"Nude Coupetini / no ice","garnish":"Not specified, small Prosecco on the side","category":"Sweet","sales":224},{"name":"Planter’s Punch","allergens":"N/A","story":"Planter's Punch is an old rum punch style rather than a drink with one certain inventor. Origin stories link it to Jamaica and to the wider Caribbean plantation era, while other claims mention hotel service in the American South. The exact origin is disputed, so it is best presented as a historic rum punch family. Its lasting idea is simple: rum, citrus, sugar and spice adjusted to local taste.","ingredients":[{"name":"APPLETON ESTATE 12YO","amount":"40 ml"},{"name":"LIME JUICE","amount":"25 ml"},{"name":"SIMPLE SYRUP","amount":"20 ml"},{"name":"PINEAPPLE JUICE","amount":"40 ml"},{"name":"ANGOSTURA BITTERS","amount":"2 dash"},{"name":"SODA WATER","amount":"Top"}],"method":"Shake / Double Strain","glass":"Terracotta Mug / Ice Cubes","garnish":"Lime Wheel","category":"Sweet","sales":4},{"name":"Paper Plane","allergens":"N/A","story":"The Paper Plane was created by Sam Ross in 2007 while he was connected with The Violet Hour in Chicago. It is a modern equal-parts cocktail inspired by the Last Word template. Bourbon, Aperol, amaro and lemon make it bitter, sour and easy to balance. Its name comes from the M.I.A. song Paper Planes, which was popular when the drink was created.","ingredients":[{"name":"HOUSE BOURBON","a
