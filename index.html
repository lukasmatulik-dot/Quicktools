mount":"30 ml"},{"name":"APEROL","amount":"30 ml"},{"name":"AMARO NONINO","amount":"30 ml"},{"name":"LEMON JUICE","amount":"30 ml"}],"method":"Shake / Double Strain","glass":"Nick & Nora / no ice","garnish":"Not specified","category":"Bitter","sales":7},{"name":"Rob Roy","allergens":"12","story":"The Rob Roy was created in the 1890s at the Waldorf-Astoria in New York. It was named after the operetta Rob Roy, which was being performed in the city at the time. The drink is essentially a Manhattan made with Scotch whisky. Its history shows how a simple base-spirit substitution can become a recognised classic when the name and context are strong.","ingredients":[{"name":"CHIVAS 12Y","amount":"50 ml"},{"name":"CARPANO ANTICA FORMULA","amount":"20 ml"},{"name":"ANGOSTURA BITTERS","amount":"4 dash"}],"method":"Stir","glass":"Nick & Nora / no ice","garnish":"Maraschino Cherry","category":"Boozy","sales":0},{"name":"Ramos Gin Fizz","allergens":"3, 7","story":"The Ramos Gin Fizz was created by Henry C. Ramos in New Orleans in 1888. It became famous for its long, vigorous shake and silky texture. The recipe combines gin, citrus, cream, egg white, sugar, orange flower water and soda. Its demanding preparation made it a symbol of New Orleans bar craft and hospitality.","ingredients":[{"name":"HOUSE GIN","amount":"40 ml"},{"name":"LEMON JUICE","amount":"10 ml"},{"name":"LIME JUICE","amount":"10 ml"},{"name":"SIMPLE SYRUP","amount":"20 ml"},{"name":"HEAVY CREAM","amount":"15 ml"},{"name":"EGG WHITE","amount":"15 ml"},{"name":"DASH OF ORANGE FLOWER WATER","amount":"4 dash"},{"name":"SODA WATER","amount":"Top"}],"method":"Dry Shake / Shake / Double Strain","glass":"Nude Highball / Ice Cubes","garnish":"Not specified","category":"Sweet","sales":1},{"name":"Rosita","allergens":"12","story":"The Rosita is a tequila-based bitter cocktail with a Negroni-like structure. Its exact origin is not clearly documented, and it was not as continuously famous as the Negroni or Margarita. Gary Gaz Regan helped bring attention back to the drink in modern cocktail writing. It is useful for guests who want tequila in a stirred, bitter and aperitif-style format.","ingredients":[{"name":"HOUSE TEQUILA","amount":"40 ml"},{"name":"ANTICA FORMULA","amount":"10 ml"},{"name":"DOLIN DRY","amount":"10 ml"},{"name":"CAMPARI","amount":"10 ml"},{"name":"ANGOSTURA BITTERS","amount":"1 dash"}],"method":"Stir","glass":"Nick & Nora / no ice","garnish":"Grapefruit Peel","category":"Bitter","sales":0},{"name":"Rusty Nail","allergens":"N/A","story":"The Rusty Nail is a simple Scotch and Drambuie drink that became strongly associated with mid-twentieth-century lounge culture. The exact creator is not clearly documented, but the name was established by the 1960s. Its reputation is often linked to the Rat Pack era and after-dinner service. The drink works because the honeyed herbal sweetness of Drambuie softens and lengthens the Scotch.","ingredients":[{"name":"J.W BLACK LABEL","amount":"40 ml"},{"name":"DRAMBUIE","amount":"20 ml"}],"method":"Stir","glass":"Nude Water / ice sphere","garnish":"Lemon Coin","category":"Boozy","sales":4},{"name":"Sazerac","allergens":"N/A","story":"The Sazerac is one of New Orleans' defining cocktails. It began as a Cognac drink and is linked to Sazerac de Forge et Fils brandy and Peychaud's bitters. Rye whiskey became common later, especially after phylloxera and changing spirit availability affected Cognac supply. The absinthe rinse, sugar, bitters and strong base spirit make it a compact piece of American cocktail history.","ingredients":[{"name":"ASK FOR COGNAC OR RYE","amount":"50 ml"},{"name":"SIMPLE SYRUP","amount":"10 ml"},{"name":"PEYCHAUD’S BITTERS","amount":"4 dash"},{"name":"SPRAY OF ABSINTHE","amount":"2 ml"}],"method":"Longer Stir","glass":"Nick & Nora / no ice","garnish":"Lemon Peel","category":"Boozy","sales":16},{"name":"Singapore Sling","allergens":"N/A","story":"The Singapore Sling is associated with Raffles Hotel in Singapore and bartender Ngiam Tong Boon. It was created in the early twentieth century, although the exact original recipe has been debated and reconstructed over time. The drink sits between gin sling, tropical long drink and hotel signature cocktail. Its cultural importance comes as much from the Raffles setting as from the recipe itself.","ingredients":[{"name":"HOUSE GIN","amount":"40 ml"},{"name":"CHERRY HEERING","amount":"10 ml"},{"name":"GRENADINE","amount":"10 ml"},{"name":"BENEDICTINE D.O.M","amount":"5 ml"},{"name":"COINTREAU","amount":"5 ml"},{"name":"LEMON JUICE","amount":"25 ml"},{"name":"PINEAPPLE JUICE","amount":"30 ml"},{"name":"ANGOSTURA BITTERS","amount":"2 dash"}],"method":"Shake / Double Strain","glass":"Nude Highball / Ice Cubes","garnish":"Mint Sprig / Maraschino Cherry","category":"Sweet","sales":0},{"name":"Sex On the Beach","allergens":"N/A","story":"Sex on the Beach is a late twentieth-century drink connected with the rise of peach schnapps and colourful vodka cocktails. One common story credits Florida bartender Ted Pizio during a promotion in the 1980s. The exact origin is not as firmly documented as older classics, but the drink clearly belongs to the spring-break and disco-era style of service. Its name, fruit profile and easy build made it a mass-market bar staple.","ingredients":[{"name":"HOUSE VODKA","amount":"40 ml"},{"name":"PEACH LIQUEUR","amount":"20 ml"},{"name":"PINEAPPLE JUICE","amount":"50 ml"},{"name":"CRANBERRY JUICE","amount":"30 ml"}],"method":"Shake","glass":"Nude Highball / Ice Cube","garnish":"Dry Pineapple / Mint Sprig","category":"Sweet","sales":0},{"name":"Sea Breeze","allergens":"N/A","story":"The Sea Breeze name has appeared on more than one drink over time. The modern vodka, cranberry and grapefruit version became prominent through twentieth-century juice marketing and American highball culture. Earlier recipes under the same name were different, so the history should not be treated as a single continuous formula. Today it is best understood as a clean, tart vodka highball from the cranberry-juice era.","ingredients":[{"name":"HOUSE VODKA","amount":"40 ml"},{"name":"CRANBERRY JUICE","amount":"120 ml"},{"name":"GRAPEFRUIT JUICE","amount":"30 ml"}],"method":"Build in glass","glass":"Nude Highball","garnish":"Lime Wedge","category":"Sour","sales":0},{"name":"Russian Spring Punch","allergens":"12","story":"The Russian Spring Punch was created by Dick Bradsell in London in the 1980s. The name refers to vodka as the Russian element and to the Collins-like, sparkling spring style of the drink. It combines citrus, sugar, cassis, vodka and sparkling wine in a tall, refreshing format. The drink is part of the same modern British cocktail movement that produced the Bramble and Espresso Martini.","ingredients":[{"name":"HOUSE VODKA","amount":"25 ml"},{"name":"CRÈME DE CASSIS","amount":"12 ml"},{"name":"LEMON JUICE","amount":"25 ml"},{"name":"SIMPLE SYRUP","amount":"10 ml"},{"name":"PROSECCO","amount":"Top"}],"method":"Shake","glass":"Nude Highball","garnish":"Blackberry/Mint Leaves","category":"Sweet","sales":0},{"name":"Southside","allergens":"N/A","story":"The Southside is a gin, citrus and mint drink with a disputed origin. Some stories connect it to Prohibition-era Chicago, while others link it to clubs in New York. The exact source is not clearly documented, so it is better to present it as a classic minty gin sour with competing stories. Soda makes it a Southside Fizz, while sparkling wine moves it toward a Southside Royale.","ingredients":[{"name":"HOUSE GIN","amount":"40 ml"},{"name":"LIME JUICE","amount":"20 ml"},{"name":"SIMPLE SYRUP","amount":"15 ml"},{"name":"MINT LEAVES","amount":"8 pcs"}],"method":"Shake / Double Strain","glass":"Nick & Nora / no ice","garnish":"Not specified","category":"Sour","sales":0},{"name":"Sidecar","allergens":"N/A","story":"The Sidecar's origin is disputed between Paris and London. It is usually dated to the First World War or the years just after it, with Harry's New York Bar and the Ritz often appearing in the stories. The motorcycle sidecar story is famous, but not fully proven. What is clear is that cognac, orange liqueur and lemon created one of the most influential sour templates of the twentieth century.","ingredients":[{"name":"HOUSE COGNAC","amount":"40 ml"},{"name":"LEMON JUICE","amount":"20 ml"},{"name":"GRAND MARNIER","amount":"20 ml"},{"name":"BARSPOON SIMPLE SYRUP","amount":"1 ml"}],"method":"Shake / Double Strain","glass":"Nick & Nora / no ice","garnish":"Sugar Rim","category":"Sour","sales":8},{"name":"Spicy Fifty","allergens":"N/A","story":"The Spicy Fifty is a modern vodka cocktail credited to Salvatore Calabrese in London. It was created for the bar Fifty and uses vanilla, elderflower, lime and chilli to give a sweet-spicy sour profile. The drink belongs to the contemporary era rather than the pre-Prohibition canon. Its value for guests is the controlled heat, which should support the citrus and vanilla rather than dominate the drink.","ingredients":[{"name":"HOUSE VODKA","amount":"50 ml"},{"name":"BELVOIR ELDERFLOWER CORDIAL","amount":"25 ml"},{"name":"LIME JUICE","amount":"20 ml"},{"name":"CHILLI TINCTURE","amount":"3 dash"}],"method":"Shake","glass":"Nick & Nora","garnish":"Not specified","category":"Sour","sales":0},{"name":"Stinger","allergens":"N/A","story":"The Stinger is a classic combination of brandy and white crème de menthe. It became associated with high-society and after-dinner drinking in the early twentieth century. The exact origin is not clearly documented, although it appears in old cocktail books and was fashionable for decades. Its simplicity makes it a useful example of the digestif-style cocktails that bridged dinner and late-night service.","ingredients":[{"name":"FERRAND 10 GENERATIONS","amount":"50 ml"},{"name":"CRÈME DE MENTHE","amount":"20 ml"}],"method":"Shake / Double Strain","glass":"Savage Pony / no ice","garnish":"Mint Leaf","category":"Boozy","sales":0},{"name":"Tequila Sunrise","allergens":"N/A","story":"The modern Tequila Sunrise is most often linked to the Trident bar in Sausalito in the early 1970s. Earlier drinks with the same name existed, including a different 1930s version from Arizona or Mexico-related service. The Rolling Stones helped popularise the modern orange juice and grenadine version during their 1972 tour. Its layered colour made it one of the most recognisable visual drinks of the decade.","ingredients":[{"name":"HOUSE TEQUILA BLANCO","amount":"40 ml"},{"name":"FRESH ORANGE JUICE","amount":"80 ml"},{"name":"FRESH LEMON JUICE","amount":"10 ml"},{"name":"GRENADINE","amount":"15 ml"}],"method":"Shake / Double Strain","glass":"Nude Highball / no ice","garnish":"Orange Wedge","category":"Sweet","sales":3},{"name":"Tipperary","allergens":"12","story":"The Tipperary is an Irish whiskey cocktail from the early twentieth century. It appears in Hugo Ensslin's 1916 Recipes for Mixed Drinks. The name likely connects to the wartime song It's a Long Way to Tipperary, which was popular during the First World War. The combination of Irish whiskey, sweet vermouth and herbal liqueur makes it a close relative of other stirred whiskey classics.","ingredients":[{"name":"JAMESON BLACK BARREL","amount":"40 ml"},{"name":"CINZANO ROSSO","amount":"25 ml"},{"name":"GREEN CHARTREUSE","amount":"15 ml"},{"name":"OLD FASHIONED BITTERS","amount":"2 dash"}],"method":"Stir","glass":"Nick & Nora","garnish":"Orange peel","category":"Boozy","sales":0},{"name":"Tommy's Margarita","allergens":"N/A","story":"Tommy's Margarita was created by Julio Bermejo at Tommy's Mexican Restaurant in San Francisco. It replaces orange liqueur with agave syrup, putting more focus on tequila and lime. The drink helped shape modern tequila service by encouraging better tequila selection and a cleaner sour structure. It is now treated as a contemporary classic rather than simply a house variation.","ingredients":[{"name":"HOUSE TEQUILA REPOSADO","amount":"50 ml"},{"name":"FRESH LIME JUICE","amount":"20 ml"},{"name":"AGAVE SYRUP","amount":"10 ml"},{"name":"SALINE SOLUTION","amount":"1 dash"}],"method":"Shake","glass":"Nude Lowball / ice block","garnish":"Lime Wedge / Salt Rim","category":"Sour","sales":3},{"name":"Tuxedo","allergens":"12","story":"The Tuxedo is a family of gin-and-vermouth cocktails rather than one perfectly fixed recipe. The name is linked to the Tuxedo Club in Orange County, New York. Versions appeared in late nineteenth- and early twentieth-century cocktail books, often using maraschino, absinthe or bitters. It sits historically between the Martinez and the Martini in the evolution of aromatic stirred gin drinks.","ingredients":[{"name":"OLD TOM GIN","amount":"30 ml"},{"name":"CINZANO DRY","amount":"30 ml"},{"name":"MARASCHINO LUXARDO","amount":"1 BSP"},{"name":"ABSINTH","amount":"1 BSP"},{"name":"ORANGE BITTERS","amount":"3 dash"}],"method":"Stir","glass":"Savage Pony","garnish":"Lemon Peel","category":"Boozy","sales":0},{"name":"Mole Negroni","allergens":"12","story":"The exact origin of this variation is not clearly documented in major cocktail history sources. It belongs to the modern Negroni family, where bartenders adjust the classic bitter-vermouth-gin structure with new accents. Mole bitters or chocolate-spice notes add depth without changing the drink's aperitif identity. It should be presented as a contemporary house-style Negroni variation rather than a historic classic with a fixed origin.","ingredients":[{"name":"VIDA MEZCAL","amount":"20 ml"},{"name":"PUNT E MES","amount":"20 ml"},{"name":"CYNAR","amount":"10 ml"},{"name":"AVERNA AMARO","amount":"10 ml"},{"name":"CHOCOLATE BITTERS","amount":"2 dash"}],"method":"Stir","glass":"Nude Lowball / ice block","garnish":"Lemon Peel","category":"Bitter","sales":0},{"name":"White Negroni","allergens":"12","story":"The White Negroni was created by Wayne Collins in France in 2001. It was developed as a lighter-coloured variation on the Negroni, using French aperitif ingredients instead of Campari and sweet vermouth. Suze and Lillet Blanc became the best-known modern formula. The drink is now a contemporary classic because it keeps the bitter aperitif idea while changing the flavour and colour completely.","ingredients":[{"name":"TANQUERAY GIN","amount":"30 ml"},{"name":"SUZE","amount":"30 ml"},{"name":"LILLET BLANC","amount":"30 ml"}],"method":"Stir","glass":"Nude Water / ice sphere","garnish":"Grapefruit Peel","category":"Bitter","sales":0},{"name":"Whisky Smash","allergens":"N/A","story":"The Whiskey Smash is a nineteenth-century style related to the Mint Julep and the Sour. Jerry Thomas printed smash-style drinks in his bartending guides, helping establish the category. Dale DeGroff later helped revive the Whiskey Smash for modern bars at the Rainbow Room in New York. It is best explained as a minty whiskey sour served over ice rather than a single recent invention.","ingredients":[{"name":"HOUSE BOURBON","amount":"50 ml"},{"name":"LEMON JUICE","amount":"25 ml"},{"name":"SIMPLE SYRUP","amount":"20 ml"},{"name":"MINT LEAVES","amount":"8 pcs"}],"method":"Shake / Double Strain","glass":"Riedel OF / ice chunks","garnish":"Mint Sprig","category":"Sour","sales":0},{"name":"White Lady","allergens":"3","story":"The White Lady has a disputed origin. Harry MacElhone served an early version at Ciro's Club in London before later gin-based versions became standard. Harry Craddock also helped fix the drink in the canon through The Savoy Cocktail Book in 1930. The modern form is a clean gin sour with orange liqueur, sitting close to the Sidecar family.","ingredients":[{"name":"HOUSE GIN","amount":"40 ml"},{"name":"COINTREAU","amount":"10 ml"},{"name":"LEMON JUICE","amount":"25 ml"},{"name":"SIMPLE SYRUP","amount":"10 ml"},{"name":"EGG WHITE","amount":"15 ml"}],"method":"Dry Shake / Shake / Double Strain","glass":"Savage Pony / no ice","garnish":"Lemon Coin","category":"Sour","sales":6},{"name":"White Russian","allergens":"7","story":"The White Russian developed from the Black Russian by adding cream. The exact creator is not clearly documented, but it became associated with the sweet, creamy drinking style of the 1970s. Its fame was revived by the 1998 film The Big Lebowski, where it became the signature drink of the Dude. The cocktail remains popular because vodka, coffee liqueur and cream create an easy after-dinner profile.","ingredients":[{"name":"HOUSE VODKA","amount":"40 ml"},{"name":"KAHLUA","amount":"30 ml"},{"name":"FLOAT OF HEAVY CREAM","amount":"Top"}],"method":"Stir / Float","glass":"Nude Lowball / ice block","garnish":"Not specified","category":"Sweet","sales":52},{"name":"Whisky Sour","allergens":"3","story":"The Whiskey Sour belongs to the original Sour family of spirit, citrus and sugar. It was already well established in nineteenth-century American bartending and appears in early cocktail books. Egg white is a later but common service choice, giving texture without changing the core structure. Its longevity comes from the fact that it shows whiskey clearly while making it bright, balanced and approachable.","ingredients":[{"name":"CHIVAS REGAL 12","amount":"40 ml"},{"name":"LEMON JUICE","amount":"20 ml"},{"name":"SIMPLE SYRUP","amount":"15 ml"},{"name":"EGG WHITE","amount":"20 ml"}],"method":"Shake / Double Strain","glass":"Nude Lowball / Chunk Ice","garnish":"Lemon Coin","category":"Sour","sales":131},{"name":"Vieux Carré","allergens":"12","story":"The Vieux Carré was created in New Orleans by Walter Bergeron at the Hotel Monteleone. It is usually dated to the 1930s and is named for the French Quarter, whose French name is Vieux Carré. The recipe combines rye, Cognac, sweet vermouth, Bénédictine and bitters in a rich stirred format. It is one of the great New Orleans classics because it reflects the city's French, American and herbal liqueur influences in one glass.","ingredients":[{"name":"HOUSE COGNAC","amount":"25 ml"},{"name":"MICHTERS RYE","amount":"25 ml"},{"name":"CARPANO ANTICA FORMULA","amount":"25 ml"},{"name":"BENEDICTINE D.O.M.","amount":"5 ml"},{"name":"ANGOSTURA BITTERS","amount":"2 dash"},{"name":"PEYCHAUD’S BITTERS","amount":"2 dash"}],"method":"Stir","glass":"Nude Water / ice chunk","garnish":"Lemon Peel","category":"Boozy","sales":8}];

 on the Isle of Skye. The age or style statement is 30 Year Old. Talisker official / Malts official / The Whisky Exchange / Diageo official"},{"type":"product","name":"The Macallan No. 6","category":"Rare Spirits","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"The Macallan"},{"label":"Country","value":"Scotland"},{"label":"Region","value":"Speyside"},{"label":"Type / Style","value":"Speyside Single Malt Scotch Whisky"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"43 %"},{"label":"Taste profile","value":"raisin, fig, orange, ginger, cinnamon"}],"description":"The Macallan No. 6 is a Speyside single malt focused on natural colour and sherry oak character. First-fill sherry-seasoned Spanish oak casks give dried fruit, orange, ginger, cinnamon and soft oak notes. It is presented in a Lalique crystal decanter. Key flavour notes include raisin, fig, orange, ginger, cinnamon.","inside":"","source":"The Macallan official","search":"The Macallan No. 6 Rare Spirits Distillery / Producer The Macallan Country Scotland Region Speyside Type / Style Speyside Single Malt Scotch Whisky Age / Statement no age statement ABV 43 % Taste profile raisin, fig, orange, ginger, cinnamon The Macallan No. 6 is a Speyside single malt focused on natural colour and sherry oak character. First-fill sherry-seasoned Spanish oak casks give dried fruit, orange, ginger, cinnamon and soft oak notes. It is presented in a Lalique crystal decanter. Key flavour notes include raisin, fig, orange, ginger, cinnamon. The Macallan official"},{"type":"product","name":"The Macallan Rare Cask","category":"Rare Spirits","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"The Macallan"},{"label":"Country","value":"Scotland"},{"label":"Region","value":"Speyside"},{"label":"Type / Style","value":"Speyside Single Malt Scotch Whisky"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"43 %"},{"label":"Taste profile","value":"vanilla, raisin, apple, citrus, dark chocolate"}],"description":"The Macallan Rare Cask is a Speyside single malt focused on sherry-seasoned oak character. Its profile highlights notes of vanilla, raisin, apple, citrus and dark chocolate. Because exact releases can vary, the bottle should be checked for the specific release. It is built from carefully selected sherry-seasoned oak casks from the distillery’s reserves.","inside":"","source":"The Macallan official / The Whisky Exchange","search":"The Macallan Rare Cask Rare Spirits Distillery / Producer The Macallan Country Scotland Region Speyside Type / Style Speyside Single Malt Scotch Whisky Age / Statement no age statement ABV 43 % Taste profile vanilla, raisin, apple, citrus, dark chocolate The Macallan Rare Cask is a Speyside single malt focused on sherry-seasoned oak character. Its profile highlights notes of vanilla, raisin, apple, citrus and dark chocolate. Because exact releases can vary, the bottle should be checked for the specific release. It is built from carefully selected sherry-seasoned oak casks from the distillery’s reserves. The Macallan official / The Whisky Exchange"},{"type":"product","name":"The Macallan Reflexion","category":"Rare Spirits","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"The Macallan"},{"label":"Country","value":"Scotland"},{"label":"Region","value":"Speyside"},{"label":"Type / Style","value":"Speyside Single Malt Scotch Whisky"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"43 %"},{"label":"Taste profile","value":"orange, apple, chocolate, raisin, ginger"}],"description":"The Macallan Reflexion is a full-bodied Speyside single malt from the Masters Decanter Series. Smaller hogshead casks give stronger oak influence, with orange, green apple, chocolate, raisin, cinnamon and ginger. Deep natural colour comes from first-fill casks; the decanter facets are designed to reflect that colour.","inside":"","source":"The Macallan official","search":"The Macallan Reflexion Rare Spirits Distillery / Producer The Macallan Country Scotland Region Speyside Type / Style Speyside Single Malt Scotch Whisky Age / Statement no age statement ABV 43 % Taste profile orange, apple, chocolate, raisin, ginger The Macallan Reflexion is a full-bodied Speyside single malt from the Masters Decanter Series. Smaller hogshead casks give stronger oak influence, with orange, green apple, chocolate, raisin, cinnamon and ginger. Deep natural colour comes from first-fill casks; the decanter facets are designed to reflect that colour. The Macallan official"},{"type":"product","name":"Beefeater","category":"Gin","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Beefeater / Pernod Ricard"},{"label":"Country","value":"United Kingdom"},{"label":"Region","value":"London"},{"label":"Type / Style","value":"London Dry Gin"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"40 %"},{"label":"Taste profile","value":"juniper, citrus, coriander, angelica, liquorice"}],"description":"Beefeater is a London Dry gin from London in the United Kingdom. Its profile centres on juniper, citrus, coriander, angelica and liquorice. It is distilled in London and made with nine botanicals. One of the most famous London Dry gins takes its name from the Yeoman Warders, the ceremonial guards of the Tower of London, who appear on the label. The recipe created by pharmacist James Burrough in the 19th century still uses nine botanicals and a 24-hour steeping process before distillation.","inside":"","source":"Beefeater official / Pernod Ricard official","search":"Beefeater Gin Distillery / Producer Beefeater / Pernod Ricard Country United Kingdom Region London Type / Style London Dry Gin Age / Statement no age statement ABV 40 % Taste profile juniper, citrus, coriander, angelica, liquorice Beefeater is a London Dry gin from London in the United Kingdom. Its profile centres on juniper, citrus, coriander, angelica and liquorice. It is distilled in London and made with nine botanicals. One of the most famous London Dry gins takes its name from the Yeoman Warders, the ceremonial guards of the Tower of London, who appear on the label. The recipe created by pharmacist James Burrough in the 19th century still uses nine botanicals and a 24-hour steeping process before distillation. Beefeater official / Pernod Ricard official"},{"type":"product","name":"Beefeater Crown Jewel","category":"Gin","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Beefeater / Pernod Ricard"},{"label":"Country","value":"United Kingdom"},{"label":"Region","value":"London"},{"label":"Type / Style","value":"London Dry Gin"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"50 %"},{"label":"Taste profile","value":"grapefruit, juniper, citrus, spice, liquorice"}],"description":"Beefeater Crown Jewel is a London Dry gin from London in the United Kingdom. Its profile centres on grapefruit, juniper, citrus, spice and liquorice. The style remains dry, juniper-led and citrus-forward. Originally launched in the 1990s, it was later discontinued and eventually reintroduced as a higher-strength expression of the classic Beefeater style. It is bottled at 50% ABV and uses grapefruit as an additional botanical.","inside":"","source":"Beefeater / Pernod Ricard official","search":"Beefeater Crown Jewel Gin Distillery / Producer Beefeater / Pernod Ricard Country United Kingdom Region London Type / Style London Dry Gin Age / Statement no age statement ABV 50 % Taste profile grapefruit, juniper, citrus, spice, liquorice Beefeater Crown Jewel is a London Dry gin from London in the United Kingdom. Its profile centres on grapefruit, juniper, citrus, spice and liquorice. The style remains dry, juniper-led and citrus-forward. Originally launched in the 1990s, it was later discontinued and eventually reintroduced as a higher-strength expression of the classic Beefeater style. It is bottled at 50% ABV and uses grapefruit as an additional botanical. Beefeater / Pernod Ricard official"},{"type":"product","name":"Brockmans","category":"Gin","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Brockmans"},{"label":"Country","value":"United Kingdom"},{"label":"Region","value":"region not specified"},{"label":"Type / Style","value":"Contemporary Gin"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"40 %"},{"label":"Taste profile","value":"blueberry, blackcurrant, juniper, lemon peel, orange peel"}],"description":"Brockmans Intensely Smooth Gin combines traditional gin botanicals such as juniper and citrus with less typical notes of blueberries and blackberries. The brand positions it as a more modern, “properly improper” style of gin, focused on a smooth and fruit-led profile rather than a strictly classic London Dry character. Its official serve highlights pink grapefruit peel and blueberries, which support the gin’s citrus and dark-berry character. It is classified as a Contemporary Gin from the United Kingdom. Key flavour notes include blueberry, blackcurrant, juniper, lemon peel, orange peel.","inside":"","source":"Brockmans official","search":"Brockmans Gin Distillery / Producer Brockmans Country United Kingdom Region region not specified Type / Style Contemporary Gin Age / Statement no age statement ABV 40 % Taste profile blueberry, blackcurrant, juniper, lemon peel, orange peel Brockmans Intensely Smooth Gin combines traditional gin botanicals such as juniper and citrus with less typical notes of blueberries and blackberries. The brand positions it as a more modern, “properly improper” style of gin, focused on a smooth and fruit-led profile rather than a strictly classic London Dry character. Its official serve highlights pink grapefruit peel and blueberries, which support the gin’s citrus and dark-berry character. It is classified as a Contemporary Gin from the United Kingdom. Key flavour notes include blueberry, blackcurrant, juniper, lemon peel, orange peel. Brockmans official"},{"type":"product","name":"Canaima","category":"Gin","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Canaïma"},{"label":"Country","value":"Venezuela"},{"label":"Region","value":"Amazonia"},{"label":"Type / Style","value":"Small Batch Gin"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"47 %"},{"label":"Taste profile","value":"tropical fruit, citrus, herbs, grapefruit, passion fruit"}],"description":"Canaima is a small-batch gin from Amazonia, Venezuela. Its profile centres on tropical fruit, citrus, herbs, grapefruit and passion fruit. Amazonian botanicals are used alongside classic gin botanicals.","inside":"","source":"Canaïma official","search":"Canaima Gin Distillery / Producer Canaïma Country Venezuela Region Amazonia Type / Style Small Batch Gin Age / Statement no age statement ABV 47 % Taste profile tropical fruit, citrus, herbs, grapefruit, passion fruit Canaima is a small-batch gin from Amazonia, Venezuela. Its profile centres on tropical fruit, citrus, herbs, grapefruit and passion fruit. Amazonian botanicals are used alongside classic gin botanicals. Canaïma official"},{"type":"product","name":"Citadelle","category":"Gin","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Citadelle Gin"},{"label":"Country","value":"France"},{"label":"Region","value":"Charente"},{"label":"Type / Style","value":"French Dry Gin"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"44 %"},{"label":"Taste profile","value":"juniper, citrus, spice, flowers, anise"}],"description":"Citadelle is a French dry gin from Charente, France. Its profile centres on juniper, citrus, spice, flowers and anise. It is produced by Maison Ferrand as a French craft gin.","inside":"","source":"Citadelle official","search":"Citadelle Gin Distillery / nod Ricard Country Italy Region region not specified Type / Style Italian Dry Gin Age / Statement no age statement ABV 41 % Taste profile juniper, coriander, anise, liquorice, citrus Malfy is an Italian dry gin from Italy. Its profile centres on juniper, coriander, anise, liquorice and citrus. The dry-style expression in the range is Originale. Inspired by the Amalfi Coast, it is distilled with Italian botanicals including juniper, lemons, pink grapefruit and oranges. Its identity is built around a bright Mediterranean citrus style. Malfy official / Pernod Ricard official"},{"type":"product","name":"Mermaid Pink","category":"Gin","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Mermaid / Isle of Wight Distillery"},{"label":"Country","value":"United Kingdom"},{"label":"Region","value":"Isle of Wight"},{"label":"Type / Style","value":"Pink Gin"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"38 %"},{"label":"Taste profile","value":"not specified"}],"description":"Mermaid Pink Gin is made by steeping fresh Isle of Wight strawberries in the distillery’s signature smooth gin before redistillation. The result is an aromatic, fruit-led gin built around strawberry character. The strawberries are grown in the Arreton Valley on the Isle of Wight.","inside":"","source":"Isle of Wight Distillery official","search":"Mermaid Pink Gin Distillery / Producer Mermaid / Isle of Wight Distillery Country United Kingdom Region Isle of Wight Type / Style Pink Gin Age / Statement no age statement ABV 38 % Taste profile not specified Mermaid Pink Gin is made by steeping fresh Isle of Wight strawberries in the distillery’s signature smooth gin before redistillation. The result is an aromatic, fruit-led gin built around strawberry character. The strawberries are grown in the Arreton Valley on the Isle of Wight. Isle of Wight Distillery official"},{"type":"product","name":"Mermaid Zest","category":"Gin","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Mermaid / Isle of Wight Distillery"},{"label":"Country","value":"United Kingdom"},{"label":"Region","value":"Isle of Wight"},{"label":"Type / Style","value":"Citrus Gin"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"40 %"},{"label":"Taste profile","value":"not specified"}],"description":"Mermaid Zest Gin is made by the Isle of Wight Distillery in southern England as a citrus-led twist on the original Mermaid Gin recipe. It blends grapefruit peel, island bergamot and wild coastal rosemary for a bright aromatic profile with a crisp finish. It is classified as a Citrus Gin from the Isle of Wight, United Kingdom.","inside":"","source":"Isle of Wight Distillery official","search":"Mermaid Zest Gin Distillery / Producer Mermaid / Isle of Wight Distillery Country United Kingdom Region Isle of Wight Type / Style Citrus Gin Age / Statement no age statement ABV 40 % Taste profile not specified Mermaid Zest Gin is made by the Isle of Wight Distillery in southern England as a citrus-led twist on the original Mermaid Gin recipe. It blends grapefruit peel, island bergamot and wild coastal rosemary for a bright aromatic profile with a crisp finish. It is classified as a Citrus Gin from the Isle of Wight, United Kingdom. Isle of Wight Distillery official"},{"type":"product","name":"Monkey 47","category":"Gin","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Monkey 47 / Black Forest Distillers / Pernod Ricard"},{"label":"Country","value":"Germany"},{"label":"Region","value":"Black Forest"},{"label":"Type / Style","value":"Schwarzwald Dry Gin"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"47 %"},{"label":"Taste profile","value":"juniper, citrus, lingonberry, lavender, spruce"}],"description":"Monkey 47 is a Schwarzwald dry gin from the Black Forest in Germany. Its profile centres on juniper, citrus, lingonberry, lavender and spruce. It uses 47 botanicals. The “Monkey” comes from Max, a monkey sponsored by British RAF officer Montgomery Collins at the Berlin Zoo after World War II.","inside":"","source":"Monkey 47 official / Pernod Ricard official","search":"Monkey 47 Gin Distillery / Producer Monkey 47 / Black Forest Distillers / Pernod Ricard Country Germany Region Black Forest Type / Style Schwarzwald Dry Gin Age / Statement no age statement ABV 47 % Taste profile juniper, citrus, lingonberry, lavender, spruce Monkey 47 is a Schwarzwald dry gin from the Black Forest in Germany. Its profile centres on juniper, citrus, lingonberry, lavender and spruce. It uses 47 botanicals. The “Monkey” comes from Max, a monkey sponsored by British RAF officer Montgomery Collins at the Berlin Zoo after World War II. Monkey 47 official / Pernod Ricard official"},{"type":"product","name":"Nikka Coffey","category":"Gin","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Nikka"},{"label":"Country","value":"Japan"},{"label":"Region","value":"region not specified"},{"label":"Type / Style","value":"Coffey Gin"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"47 %"},{"label":"Taste profile","value":"yuzu, kabosu, amanatsu, shequasar, sansho pepper"}],"description":"Nikka Coffey is a Coffey gin from Japan. Its profile centres on yuzu, kabosu, amanatsu, shequasar and sansho pepper. It uses Coffey-still distillates and Japanese citrus botanicals.","inside":"","source":"Nikka official","search":"Nikka Coffey Gin Distillery / Producer Nikka Country Japan Region region not specified Type / Style Coffey Gin Age / Statement no age statement ABV 47 % Taste profile yuzu, kabosu, amanatsu, shequasar, sansho pepper Nikka Coffey is a Coffey gin from Japan. Its profile centres on yuzu, kabosu, amanatsu, shequasar and sansho pepper. It uses Coffey-still distillates and Japanese citrus botanicals. Nikka official"},{"type":"product","name":"OMG ”Oh My Gin”","category":"Gin","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Žufánek"},{"label":"Country","value":"Czech Republic"},{"label":"Region","value":"region not specified"},{"label":"Type / Style","value":"Distilled Herbal Gin"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"45 %"},{"label":"Taste profile","value":"juniper, grains of paradise, lavender, melissa, linden"}],"description":"OMG ”Oh My Gin” is a distilled herbal gin from the Czech Republic. Its profile centres on juniper, grains of paradise, lavender, melissa and linden. It is classified as a Distilled Herbal Gin from the Czech Republic.","inside":"","source":"Žufánek official","search":"OMG ”Oh My Gin” Gin Distillery / Producer Žufánek Country Czech Republic Region region not specified Type / Style Distilled Herbal Gin Age / Statement no age statement ABV 45 % Taste profile juniper, grains of paradise, lavender, melissa, linden OMG ”Oh My Gin” is a distilled herbal gin from the Czech Republic. Its profile centres on juniper, grains of paradise, lavender, melissa and linden. It is classified as a Distilled Herbal Gin from the Czech Republic. Žufánek official"},{"type":"product","name":"Plymouth","category":"Gin","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Plymouth Gin / Pernod Ricard"},{"label":"Country","value":"United Kingdom"},{"label":"Region","value":"Plymouth, Devon"},{"label":"Type / Style","value":"Plymouth Gin"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"41.2 %"},{"label":"Taste profile","value":"juniper, coriander, cardamom, citrus, root botanicals"}],"description":"Plymouth Gin has been produced in Plymouth since 1793 at the historic Black Friars Distillery. It is known for a balanced style with softer juniper, citrus and earthy botanical character. It is both a brand and a historic gin style tied to the city of Plymouth. Key flavour notes include juniper, coriander, cardamom, citrus, root botanicals.","inside":"","source":"Plymouth official / Pernod Ricard official","search":"Plymouth Gin Distillery / Producer Plymouth Gin / Pernod Ricard Country United Kingdom Region Plymouth, Devon Type / Style Plymouth Gin Age / Statement no age statement ABV 41.2 % Taste profile juniper, coriander, cardamom, citrus, root botanicals Plymouth Gin has been produced in Plymouth since 1793 at the historic Black Friars Distillery. It is known for a balanced style with softer juniper, citrus and earthy botanical character. It is both a brand and a historic gin style tied to the city of Plymouth. Key flavour notes include juniper, coriander, cardamom, citrus, root botanicals. Plymouth official / Pernod Ricard official"},{"type":"product","name":"Roku","category":"Gin","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Roku / House of Suntory"},{"label":"Country","value":"Japan"},{"label":"Region","value":"region not specified"},{"label":"Type / Style","value":"Japanese Craft Gin"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"43 %"},{"label":"Taste profile","value":"cherry blossom, green tea, yuzu, sansho pepper, juniper"}],"description":"Roku is a Japanese craft gin from Japan. Its profile centres on cherry blossom, green tea, yuzu, sansho pepper and juniper. The name means “six” in Japanese and refers to the six Japanese botanicals used in the gin.","inside":"","source":"House of Suntory official","search":"Roku Gin Distillery / Producer Roku / House of Suntory Country Japan Region region not specified Type / Style Japanese Craft Gin Age / Statement no age statement ABV 43 % Taste profile cherry blossom, green tea, yuzu, sansho pepper, juniper Roku is a Japanese craft gin from Japan. Its profile centres on cherry blossom, green tea, yuzu, sansho pepper and juniper. The name means “six” in Japanese and refers to the six Japanese botanicals used in the gin. House of Suntory official"},{"type":"product","name":"Tanqueray","category":"Gin","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Tanqueray / Diageo"},{"label":"Country","value":"United Kingdom"},{"label":"Region","value":"region not specified"},{"label":"Type / Style","value":"London Dry Gin"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"41.3 %"},{"label":"Taste profile","value":"juniper, coriander, angelica, liquorice, lemon zest"}],"description":"Tanqueray is a classic London Dry Gin with a juniper-forward profile. It is made with four key botanicals: juniper, coriander, angelica and liquorice. The flavour is dry, piney, herbal and lightly citrus-led. The brand was founded by Charles Tanqueray in Bloomsbury, London, in 1830; production is now in Scotland.","inside":"","source":"Tanqueray official / Diageo Bar Academy / Diageo official","search":"Tanqueray Gin Distillery / Producer Tanqueray / Diageo Country United Kingdom Region region not specified Type / Style London Dry Gin Age / Statement no age statement ABV 41.3 % Taste profile juniper, coriander, angelica, liquorice, lemon zest Tanqueray is a classic London Dry Gin with a juniper-forward profile. It is made with four key botanicals: juniper, coriander, angelica and liquorice. The flavour is dry, piney, herbal and lightly citrus-led. The brand was founded by Charles Tanqueray in Bloomsbury, London, in 1830; production is now in Scotland. Tanqueray official / Diageo Bar Academy / Diageo official"},{"type":"product","name":"Tanqueray No. Ten","category":"Gin","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Tanqueray / Diageo"},{"label":"Country","value":"United Kingdom"},{"label":"Region","value":"region not specified"},{"label":"Type / Style","value":"Ultra-premium distilled gin"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"47.3 %"},{"label":"Taste profile","value":"grapefruit, citrus, juniper, chamomile, lime"}],"description":"Tanqueray No. Ten is cial","search":"Nikka From The Barrel Whisky Distillery / Producer Nikka Country Japan Region region not specified Type / Style Blended Whisky Age / Statement no age statement ABV 51.4 % Taste profile oak, orange, vanilla, cinnamon, clove Nikka From The Barrel is a blended whisky from Japan. Its profile centres on oak, orange, vanilla, cinnamon and clove. After blending, the whisky rests before bottling to help the components marry together. It was created in 1985 to showcase the depth and intensity achieved through blending before bottling. Its iconic square bottle was designed to resemble a compact block of whisky. The Whisky Exchange / Nikka official"},{"type":"product","name":"Nikka Taketsuru Pure Malt","category":"Whisky","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Nikka"},{"label":"Country","value":"Japan"},{"label":"Region","value":"region not specified"},{"label":"Type / Style","value":"Blended Malt Whisky / Pure Malt"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"43 %"},{"label":"Taste profile","value":"red fruit, fruit tart, clove, cherry, menthol"}],"description":"Nikka Taketsuru Pure Malt is a blended malt whisky / pure malt from Japan. Its profile centres on red fruit, fruit tart, clove, cherry and menthol. The name honours Masataka Taketsuru, founder of Nikka.","inside":"","source":"The Whisky Exchange / Nikka official","search":"Nikka Taketsuru Pure Malt Whisky Distillery / Producer Nikka Country Japan Region region not specified Type / Style Blended Malt Whisky / Pure Malt Age / Statement no age statement ABV 43 % Taste profile red fruit, fruit tart, clove, cherry, menthol Nikka Taketsuru Pure Malt is a blended malt whisky / pure malt from Japan. Its profile centres on red fruit, fruit tart, clove, cherry and menthol. The name honours Masataka Taketsuru, founder of Nikka. The Whisky Exchange / Nikka official"},{"type":"product","name":"Nomad Outland Whisky","category":"Whisky","subtit uct","name":"Punt e Mes","category":"Vermouth / Sherry","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Punt e Mes"},{"label":"Country","value":"Italy"},{"label":"Region","value":"region not specified"},{"label":"Type / Style","value":"Vermouth / Bittered Vermouth"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"16 %"},{"label":"Taste profile","value":"orange, herbs, bitterness, wine, spice"}],"description":"Punt e Mes is a vermouth / bittered vermouth from Italy. Its profile centres on orange, herbs, bitterness, wine and spice. The name is linked to “one point and a half”: sweetness plus bitterness.","inside":"","source":"Punt e Mes official","search":"Punt e Mes Vermouth / Sherry Distillery / Producer Punt e Mes Country Italy Region region not specified Type / Style Vermouth / Bittered Vermouth Age / Statement no age statement ABV 16 % Taste profile orange, herbs, bitterness, wine, spice Punt e Mes is a vermouth / bittered vermouth from Italy. Its profile centres on orange, herbs, bitterness, wine and spice. The name is linked to “one point and a half”: sweetness plus bitterness. Punt e Mes official"},{"type":"product","name":"Poněšická Mrkvovice","category":"Czech Made","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Lihovar Poněšice"},{"label":"Country","value":"Czech Republic"},{"label":"Region","value":"South Bohemia"},{"label":"Type / Style","value":"Carrot Distillate / Vegetable Spirit"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"40 %"},{"label":"Taste profile","value":"carrot, earthy notes, root vegetables, mild sweetness, herbal notes"}],"description":"Poněšická Mrkvovice is an unusual Czech distillate made from carrots rather than fruit. It was first created after a poor fruit harvest led the distillery to experiment with alternative raw materials. The spirit has become one of the best-known vegetable distillates produced in the Czech Republic. The first batch was produced in 2005 after a weak fruit season. Approximately 16 kilograms of carrots are needed to produce a single 0.5-litre bottle.","inside":"","source":"Lihovar Poněšice official information","search":"Poněšická Mrkvovice Czech Made Distillery / Producer Lihovar Poněšice Country Czech Republic Region South Bohemia Type / Style Carrot Distillate / Vegetable Spirit Age / Statement no age statement ABV 40 % Taste profile carrot, earthy notes, root vegetables, mild sweetness, herbal notes Poněšická Mrkvovice is an unusual Czech distillate made from carrots rather than fruit. It was first created after a poor fruit harvest led the distillery to experiment with alternative raw materials. The spirit has become one of the best-known vegetable distillates produced in the Czech Republic. The first batch was produced in 2005 after a weak fruit season. Approximately 16 kilograms of carrots are needed to produce a single 0.5-litre bottle. Lihovar Poněšice official information"},{"type":"product","name":"Laird’s Applejack","category":"Brandy / Pisco","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Laird & Company"},{"label":"Country","value":"United States"},{"label":"Region","value":"New Jersey"},{"label":"Type / Style","value":"Blended Applejack / Apple Brandy Blend"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"40 %"},{"label":"Taste profile","value":"apple, oak, spice, vanilla, caramel"}],"description":"Laird’s Applejack is an American applejack made by blending aged apple brandy with neutral grain spirits. The official brand states that it contains 35% aged apple brandy and 65% neutral spirits, giving it a lighter style than straight apple brandy. It is strongly linked with classic American cocktails such as the Jack Rose. Laird & Company traces its distilling history back to 1780 and describes itself as America’s oldest licensed distillery.","inside":"","source":"Laird & Company official / Virginia Spirits","search":"Laird’s Applejack Brandy / Pisco Distillery / Producer Laird & Company Country United States Region New Jersey Type / Style Blended Applejack / Apple Brandy Blend Age / Statement no age statement ABV 40 % Taste profile apple, oak, spice, vanilla, caramel Laird’s Applejack is an American applejack made by blending aged apple brandy with neutral grain spirits. The official brand states that it contains 35% aged apple brandy and 65% neutral spirits, giving it a lighter style than straight apple brandy. It is strongly linked with classic American cocktails such as the Jack Rose. Laird & Company traces its distilling history back to 1780 and describes itself as America’s oldest licensed distillery. Laird & Company official / Virginia Spirits"},{"type":"product","name":"Bumbu XO","category":"Rum","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Bumbu Rum Company / Sovereign Brands"},{"label":"Country","value":"Panama"},{"label":"Region","value":"not specified"},{"label":"Type / Style","value":"Aged Rum"},{"label":"Age / Statement","value":"XO / no exact age statement verified"},{"label":"ABV","value":"40 %"},{"label":"Taste profile","value":"toffee, toasted oak, vanilla, orange zest, coffee"}],"description":"Bumbu XO is an aged rum distilled and aged in Panama. It is matured in ex-bourbon barrels and finished in white oak sherry casks. The official profile highlights toffee, toasted oak, vanilla, orange zest, peppery spice and a hint of coffee.","inside":"","source":"Bumbu official","search":"Bumbu XO Rum Distillery / Producer Bumbu Rum Company / Sovereign Brands Country Panama Region not specified Type / Style Aged Rum Age / Statement XO / no exact age statement verified ABV 40 % Taste profile toffee, toasted oak, vanilla, orange zest, coffee Bumbu XO is an aged rum distilled and aged in Panama. It is matured in ex-bourbon barrels and finished in white oak sherry casks. The official profile highlights toffee, toasted oak, vanilla, orange zest, peppery spice and a hint of coffee. Bumbu official"},{"type":"product","name":"Opihr Oriental Spiced Gin","category":"Gin","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"G&J Distillers / Quintessential Brands"},{"label":"Country","value":"England"},{"label":"Region","value":"Warrington"},{"label":"Type / Style","value":"Oriental Spiced London Dry Gin"},{"label":"Age / Statement","value":"not specified"},{"label":"ABV","value":"42.5 %"},{"label":"Taste profile","value":"cardamom, black pepper, coriander, citrus, juniper"}],"description":"Opihr Oriental Spiced Gin is a London Dry Gin inspired by the ancient Spice Route and the merchants who traded exotic botanicals across Asia, the Middle East and Europe. It is made with hand-picked ingredients including cubeb berries from Indonesia, cardamom and black pepper from India, and coriander from Morocco. The name “Opihr” is inspired by the legendary land of Ophir, mentioned in biblical accounts as a source of great wealth, spices and gold during the reign of King Solomon.","inside":"","source":"G&J Distillers / Difford’s Guide","search":"Opihr Oriental Spiced Gin Gin Distillery / Producer G&J Distillers / Quintessential Brands Country England Region Warrington Type / Style Oriental Spiced London Dry Gin Age / Statement not specified ABV 42.5 % Taste profile cardamom, black pepper, coriander, citrus, juniper Opihr Oriental Spiced Gin is a London Dry Gin inspired by the ancient Spice Route and the merchants who traded exotic botanicals across Asia, the Middle East and Europe. It is made with hand-picked ingredients including cubeb berries from Indonesia, cardamom and black pepper from India, and coriander from Morocco. The name “Opihr” is inspired by the legendary land of Ophir, mentioned in biblical accounts as a source of great wealth, spices and gold during the reign of King Solomon. G&J Distillers / Difford’s Guide"},{"type":"product","name":"Wild Turkey 101","category":"Whisky","subtitle":"Product info","facts":[{"label":"Distillery / Producer","value":"Wild Turkey Distilling Co. / Campari Group"},{"label":"Country","value":"United States"},{"label":"Region","value":"Kentucky"},{"label":"Type / Style","value":"Kentucky Straight Bourbon Whiskey"},{"label":"Age / Statement","value":"no age statement"},{"label":"ABV","value":"50.5 %"},{"label":"Taste profile","value":"vanilla, caramel, oak, spice, orange peel"}],"description":"Wild Turkey 101 is a high-proof Kentucky straight bourbon bottled at 101 proof. It is known for a bold bourbon profile with vanilla, caramel, oak and spice, making it useful both neat and in classic whiskey cocktails. The brand is strongly associated with master distiller Jimmy Russell and the Wild Turkey distillery in Lawrenceburg, Kentucky. The name comes from a 1940 hunting trip when Austin Nichols executive Thomas McCarthy shared bourbon samples with friends hunting wild turkeys. They later kept asking for “that Wild Turkey bourbon,” and the nickname became the official brand name in 1942.","inside":"","source":"Wild Turkey official / Campari Group","search":"Wild Turkey 101 Whisky Distillery / Producer Wild Turkey Distilling Co. / Campari Group Country United States Region Kentucky Type / Style Kentucky Straight Bourbon Whiskey Age / Statement no age statement ABV 50.5 % Taste profile vanilla, caramel, oak, spice, orange peel Wild Turkey 101 is a high-proof Kentucky straight bourbon bottled at 101 proof. It is known for a bold bourbon profile with vanilla, caramel, oak and spice, making it useful both neat and in classic whiskey cocktails. The brand is strongly associated with master distiller Jimmy Russell and the Wild Turkey distillery in Lawrenceburg, Kentucky. The name comes from a 1940 hunting trip when Austin Nichols executive Thomas McCarthy shared bourbon samples with friends hunting wild turkeys. They later kept asking for “that Wild Turkey bourbon,” and the nickname became the     function score(r,q){
      if(!q){return recipeSales(r)>0 ? 0 : 3;}
      const name=norm(r.name);

      const q3=q.slice(0,3);
      if(name.startsWith(q) || aliases.split(' ').some(w=>w.startsWith(q))) return 0;
      if(q.length>=3 && (name.startsWith(q3) || aliases.split(' ').some(w=>w.startsWith(q3)))) return 1;
      if(name.includes(q) || aliases.includes(q)) return 2;

      if(ing.includes(q)) return 3;

      return 99;

    function sigScore(r,q){const n=norm(r.name);const key=norm((r.key||[]).join(' '));const taste=norm((r.taste||[]).join(' '));const story=norm(r.story||'');const alias={"stumbling":"stumblin' in","stumblin":"stumblin' in",'rama':'king rama','tank':'tank olga','olga':'tank olga','ballerina':'prima ballerina','balerina':'prima ballerina','nightcap':'night cap','cafe':'café banana','banana':'café banana','bloom':'bloom berry','boh':'bohyna bohemian garden','negr':'negroni tropico almost negroni','non alcoholic':'bohyna bohemian garden passion grove almost negroni bloom berry','nealko':'bohyna bohemian garden passion grove almost negroni bloom berry'};let extra='';Object.entries(alias).forEach(([a,v])=>{const target=norm(v);if((a.includes(q)||q.includes(a))&&target.includes(n)) extra+=' '+target;}); if(!q){return nonAlcoholicSignatures.has(n)?10:0;} if(n.startsWith(q)) return 0; if(q.length>=3 && n.startsWith(q.slice(0,3))) return 1; if(n.includes(q)) return 2; if((key+' '+taste+' '+story+' '+extra).includes(q)) return 3; return 99;}

      byId('signatureList').innerHTML=list.length?list.map(r=>{
        const isNA=nonAlcoholicSignatures.has(norm(r.name));
        return `<article class="signature-card"><div class="signatureTop"><div class="signatureTitleBlock"><h2>${esc(r.name)}</h2><div class="signatureAllergens">Allergens: ${esc(r.allergens||'N/A')}</div></div><div class="sigTags">${isNA?'<span class="sigTag nonAlcoholic">Non-alcoholic</span>':''}${(r.taste||[]).slice(0,2).map(t=>`<span class="sigTag">${esc(t)}</span>`).join('')}</div></div>${r.key&&r.key.length?`<div class="keyLine"><span class="keyLabel">Key ingredients</span><span class="keyValue">${(r.key||[]).map(esc).join(' · ')}</span></div>`:''}${r.story?`<p class="story">${esc(r.story)}</p>`:''}<div class="ingrid">${(r.ingredients||[]).map(x=>`<div class="ingrow"><span class="iname">${esc(x.name)}</span><span class="iamt">${esc(x.amount||'')}</span></div>`).join('')}</div><div class="meta"><div class="metaRow"><span class="metaLabel">Method</span><span class="metaValue">${esc((r.meta&&r.meta.Technique)||'Not specified')}</span></div><div class="metaRow"><span class="metaLabel">Glass & Ice</span><span class="metaValue">${esc(glassIceValue(r.meta))}</span></div><div class="metaRow"><span class="metaLabel">Garnish</span><span class="metaValue">${esc((r.meta&&r.meta.Garnish)||'Not specified')}</span></div></div></article>`
      }).join(''):'<div class="empty">No signature found.</div>';
    }
    function factValue(r,label){return ((r.facts||[]).find(f=>norm(f.label)===norm(label))||{}).value||'';}
    function cleanSpiritInfoText(text){return String(text||'').replace(/\b(?:[A-Za-z0-9][^.!?]{0,90}?\s+)?carries\s+no\s+age\s+statement\s+and\s+is\s+bottled\s+at\s*(?:\d+(?:\.\d+)?\s*%)?\s*ABV\.?/gi,'').replace(/\s{2,}/g,' ').replace(/\s+\./g,'.').trim();}
    function productInfoText(r){const text=cleanSpiritInfoText(r.description);return text&&norm(text)!=='not specified'?text:'';}
    function spiritInsideInfoText(r){const text=cleanSpiritInfoText((r.insideInfo||r.inside)||'');return text&&norm(text)!=='not specified'?text:'';}
    function mergedSpiritInfoText(r){const productInfo=productInfoText(r);const insideInfo=spiritInsideInfoText(r);if(!productInfo)return insideInfo;if(!insideInfo)return productInfo;const p=norm(productInfo);const i=norm(insideInfo);if(p&&i&&(p===i||p.includes(i)||i.includes(p)))return productInfo.length>=insideInfo.length?productInfo:insideInfo;return `${productInfo} ${insideInfo}`;}
    function renderSpiritProduct(r){const region=factValue(r,'Region')||'Region not specified';const taste=factValue(r,'Taste profile');const facts=(r.facts||[]).filter(x=>{const label=norm(x.label);const value=norm(x.value);if(label==='taste profile')return false;if(label==='age / statement'&&value==='no age statement')return false;return String(x.value||'').trim();});const insideInfo=mergedSpiritInfoText(r);return `<article class="cocktail product-card"><div class="cocktailTop"><div class="cocktailTitleBlock"><h2>${esc(r.name)}</h2></div><div class="spiritBadges"><span class="tag Whisky">${esc(r.category||'Spirit')}</span><span class="tag Whisky regionTag">${esc(region)}</span></div></div>${insideInfo?`<div class="productInfoBlock"><div class="signatureAllergens">Product info</div><p class="story productInfoText">${esc(insideInfo)}</p></div>`:''}${taste?`<div class="tasteBlock"><div class="signatureAllergens">Taste profile</div><div class="keyValue tasteText">${esc(taste)}</div></div>`:''}<div class="ingrid productFacts">${facts.map(x=>`<div class="ingrow"><span class="iname">${esc(x.label)}</span><span class="iamt">${esc(x.value)}</span></div>`).join('')}</div>${r.source?`<div class="signatureAllergens productSource">Source: ${esc(r.source)}</div>`:''}</article>`;}
    const spiritCategoryOrder=[...new Set(spiritProducts.map(r=>r.category||'not specified'))];
    function spiritText(r){return norm(r.search||[r.name,r.category,(r.facts||[]).map(x=>`${x.label} ${x.value}`).join(' '),r.description,r.inside,r.insideInfo].join(' '));}
    function renderSpiritList(){const q=norm(byId('spiritSearch').value);const filtering=q.length>=3;const list=spiritProducts.filter(r=>!filtering||spiritText(r).includes(q));if(!list.length){byId('spiritList').innerHTML='<div class="empty">No product found.</div>';return;}byId('spiritList').innerHTML=spiritCategoryOrder.map(category=>({category,items:list.filter(r=>(r.category||'not specified')===category)})).filter(group=>group.items.length).map(group=>`<section class="spiritCategory"><h2 class="spiritCategoryTitle">${esc(group.category)}</h2><div class="spiritCategoryCards">${group.items.map(renderSpiritProduct).join('')}</div></section>`).join('');}
    function renderCocktails(){const q=norm(byId('cocktailSearch').value);let list=recipes.map(r=>Object.assign({},r,{_score:score(r,q)})).filter(r=>r._score<99||!q);list.sort((a,b)=>a._score-b._score||recipeSales(b)-recipeSales(a)||a.name.localeCompare(b.name));byId('cocktailList').innerHTML=list.length?list.map(r=>`<article class="cocktail"><div class="cocktailTop"><div class="cocktailTitleBlock"><h2>${esc(r.name)} </h2><div class="signatureAllergens">Allergens: ${esc(r.allergens||'N/A')}</div></div><span class="tag ${esc(r.category)}">${esc(r.category)} </span></div>${r.story?`<p class="story">${esc(r.story)}</p>`:''}<div class="ingrid">${(r.ingredients||[]).map(x=>`<div class="ingrow"><span class="iname">${esc(x.name)}</span><span class="iamt">${esc(x.amount||'')}</span></div>`).join('')}</div><div class="meta"><div class="metaRow"><span class="metaLabel">Method</span><span class="metaValue">${esc(r.method||'Not specified')}</span></div><div class="metaRow"><span class="metaLabel">Glass & Ice</span><span class="metaValue">${esc(r.glass||'Not specified')}</span></div><div class="metaRow"><span class="metaLabel">Garnish</span><span class="metaValue">${esc(r.garnish||'Not specified')}</span></div></div></article>`).join(''):'<div class="empty">No cocktail found.</div>';}
    let cocktailRenderFrame=0;
    let signatureRenderFrame=0;
    function scheduleCocktailRender(){if(cocktailRenderFrame)cancelAnimationFrame(cocktailRenderFrame);cocktailRenderFrame=requestAnimationFrame(()=>{cocktailRenderFrame=0;renderCocktails();});}
    function scheduleSignatureRender(){if(signatureRenderFrame)cancelAnimationFrame(signatureRenderFrame);signatureRenderFrame=requestAnimationFrame(()=>{signatureRenderFrame=0;renderSignature();});}
    function updateBottom(){const active=document.querySelector('.tab.active').dataset.screen;const bottom=byId('bottomBar');bottom.classList.remove('steakOnly');if(active==='classics'||active==='signature'||active==='spirit'){bottom.classList.add('hidden');return;}bottom.classList.remove('hidden');if(active==='cash'){const total=[...document.querySelectorAll('.cashInput')].reduce((sum,i)=>sum+Number(i.value||0)*Number(i.dataset.value),0);byId('bottomLabel').textContent='Total to change';byId('bottomValue').textContent=`${fmt.format(total)} Kč`;}else{bottom.classList.add('steakOnly');}}
    const searchInputIds=['signatureSearch','cocktailSearch','spiritSearch'];
    function resetSearchInput(id){const input=byId(id);if(!input||!input.value)return;input.value='';if(id==='signatureSearch')renderSignature();if(id==='cocktailSearch')renderCocktails();if(id==='spiritSearch')renderSpiritList();}
    function resetAllSearchInputs(){searchInputIds.forEach(resetSearchInput);}
    document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{const next=btn.dataset.screen;resetAllSearchInputs();document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));byId(next).classList.add('active');document.body.classList.toggle('classics-mode', next==='classics'||next==='signature');updateBottom();}));
    byId('clearBtn').addEventListener('click',()=>{const active=document.querySelector('.tab.active').dataset.screen;if(active==='cash')document.querySelectorAll('.cashInput').forEach(i=>i.value='');if(active==='steak'){document.querySelectorAll('.steakInput').forEach(i=>i.value='');document.querySelectorAll('.steakPrice').forEach(p=>p.textContent='0 Kč');}updateBottom();});

    byId('cocktailSearch').addEventListener('input',scheduleCocktailRender);byId('spiritSearch').addEventListener('input',renderSpiritList);renderCash();renderSteak();renderCocktails();renderSpiritList();renderSignature();byId('signatureSearch').addEventListener('input',scheduleSignatureRender);updateBottom();
  
    document.querySelectorAll('.searchClear').forEach(btn=>btn.addEventListener('click',()=>{const input=byId(btn.dataset.target); if(!input) return; input.value=''; input.dispatchEvent(new Event('input')); window.scrollTo({top:0,behavior:'smooth'}); setTimeout(()=>input.focus({preventScroll:true}),260);}));
    document.addEventListener('click',event=>{if(event.target.closest('.search'))return;resetAllSearchInputs();},true);
</script>
</body>
</html>
